<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       BABY STEPS — MULTI-STYLE OVERLAY
       Styles available via ?style= param:
         duo       - 2 avatars + altitudes (default)
         solo      - single player big showcase
         scorebug  - tiny football scoreboard
         banner    - bottom-third banner with stats
       Solo mode also activates with ?player=playerA or playerB
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:      #22d3ee;
      --a-glow: rgba(34, 211, 238, 0.6);
      --b:      #fbbf24;
      --b-glow: rgba(251, 191, 36, 0.6);
      --shadow: 0 2px 4px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.7);
    }

    html, body {
      background: transparent;
      width: 100%; height: 100%;
      overflow: hidden;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    img {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
    }

    .hidden { display: none !important; }

    /* =========================================================================
       STYLE: DUO (default) — 2 avatars side by side
       ========================================================================= */
    .duo {
      display: flex;
      align-items: center;
      gap: 44px;
    }
    .duo .player {
      --c:      var(--a);
      --c-glow: var(--a-glow);
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .duo .player[data-p="b"] {
      --c:      var(--b);
      --c-glow: var(--b-glow);
    }
    .duo .avatar {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 6px 22px rgba(0,0,0,0.75), 0 2px 6px rgba(0,0,0,0.55);
    }
    .duo .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .duo .info__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 84px;
      line-height: 0.85;
      color: #fff;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .duo .info__alt small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--c);
      margin-left: 4px;
      text-shadow: var(--shadow), 0 0 14px var(--c-glow);
    }
    .duo .info__name {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.92);
      text-shadow: var(--shadow);
      margin-top: 6px;
      text-transform: lowercase;
    }

    /* =========================================================================
       STYLE: SOLO — single player big showcase
       ========================================================================= */
    .solo {
      display: flex;
      align-items: flex-start;
      gap: 26px;
      --c:      var(--a);
      --c-glow: var(--a-glow);
    }
    .solo .info { padding-top: 8px; }
    .solo[data-p="b"] {
      --c:      var(--b);
      --c-glow: var(--b-glow);
    }
    .solo .avatar {
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      box-shadow: 0 8px 28px rgba(0,0,0,0.8), 0 2px 8px rgba(0,0,0,0.6);
    }
    .solo .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .solo .info__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 120px;
      line-height: 0.82;
      color: #fff;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .solo .info__alt small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--c);
      margin-left: 6px;
      text-shadow: var(--shadow), 0 0 16px var(--c-glow);
    }
    .solo .info__name {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 44px;
      font-weight: 700;
      color: rgba(255,255,255,0.92);
      text-shadow: var(--shadow);
      margin-top: 8px;
      text-transform: lowercase;
    }
    /* Solo stats panel — two cells separated by a thin divider */
    .solo .info__meta {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 16px;
    }
    .meta-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .meta-cell__num {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 34px;
      line-height: 0.9;
      color: #fff;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .meta-cell__num small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--c);
      margin-left: 2px;
      text-shadow: var(--shadow), 0 0 10px var(--c-glow);
    }
    .meta-cell__label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-shadow: var(--shadow);
    }
    .meta-divider {
      width: 1px;
      height: 38px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18), transparent);
    }

    /* =========================================================================
       STYLE: SCOREBUG — tiny football scoreboard (compact corner)
       ========================================================================= */
    .scorebug {
      display: flex;
      align-items: stretch;
      background: linear-gradient(180deg, rgba(8,11,17,0.92), rgba(4,6,10,0.92));
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
      font-family: 'Big Shoulders Display', sans-serif;
    }
    .scorebug__side {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
    }
    .scorebug__side--a {
      background: linear-gradient(90deg, rgba(34,211,238,0.18), transparent);
      border-left: 3px solid var(--a);
    }
    .scorebug__side--b {
      background: linear-gradient(270deg, rgba(251,191,36,0.18), transparent);
      border-right: 3px solid var(--b);
      flex-direction: row-reverse;
    }
    .scorebug__avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .scorebug__avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .scorebug__name {
      font-size: 16px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.02em;
      text-transform: lowercase;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    .scorebug__score {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: rgba(0,0,0,0.45);
    }
    .scorebug__num {
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
      min-width: 40px;
      text-align: center;
    }
    .scorebug__num--a { color: var(--a); text-shadow: 0 0 10px var(--a-glow); }
    .scorebug__num--b { color: var(--b); text-shadow: 0 0 10px var(--b-glow); }
    .scorebug__sep {
      font-size: 18px;
      color: rgba(255,255,255,0.35);
      font-weight: 500;
    }

    /* =========================================================================
       STYLE: BANNER — wide bottom-third with all stats
       ========================================================================= */
    .banner {
      width: 100%;
      max-width: 1000px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      background: linear-gradient(180deg, rgba(8,11,17,0.92), rgba(4,6,10,0.95));
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
      overflow: hidden;
      font-family: 'Big Shoulders Display', sans-serif;
    }
    .banner__side {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      position: relative;
    }
    .banner__side--a {
      background: linear-gradient(90deg, rgba(34,211,238,0.16), transparent 70%);
    }
    .banner__side--a::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--a);
      box-shadow: 0 0 12px var(--a-glow);
    }
    .banner__side--b {
      background: linear-gradient(270deg, rgba(251,191,36,0.16), transparent 70%);
      flex-direction: row-reverse;
      text-align: right;
    }
    .banner__side--b::before {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--b);
      box-shadow: 0 0 12px var(--b-glow);
    }
    .banner__avatar {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.6);
    }
    .banner__avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .banner__info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .banner__side--b .banner__info { align-items: flex-end; }
    .banner__name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.92);
      text-transform: lowercase;
      line-height: 1;
    }
    .banner__alt {
      font-size: 58px;
      font-weight: 900;
      line-height: 0.9;
      color: #fff;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }
    .banner__alt small {
      font-size: 30px;
      font-weight: 700;
      margin-left: 3px;
      line-height: 0.9;
    }
    .banner__side--a .banner__alt small { color: var(--a); text-shadow: 0 0 10px var(--a-glow); }
    .banner__side--b .banner__alt small { color: var(--b); text-shadow: 0 0 10px var(--b-glow); }
    .banner__stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }
    .banner__stats strong {
      color: #fff;
      font-weight: 700;
      margin: 0 2px;
    }

    /* Central VS divider */
    .banner__vs {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      background: rgba(0,0,0,0.45);
      min-width: 110px;
    }
    .banner__vs-label {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .banner__delta {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .banner__delta-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* =========================================================================
       STYLE: VS — clean, big, punchy
       ========================================================================= */
    .vs {
      display: flex;
      align-items: center;
      gap: 100px;
    }

    .vs__player {
      --c: var(--a);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: vsPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    }
    .vs__player--b {
      --c: var(--b);
      animation-delay: 0.15s;
    }
    @keyframes vsPop {
      from { opacity: 0; transform: scale(0.6); }
      60%  { opacity: 1; transform: scale(1.06); }
      to   { opacity: 1; transform: scale(1); }
    }

    .vs__avatar {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      overflow: hidden;
      box-shadow: 0 10px 32px rgba(0,0,0,0.85), 0 3px 8px rgba(0,0,0,0.6);
    }
    .vs__avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }

    .vs__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 150px;
      line-height: 0.82;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-shadow:
        0 4px 10px rgba(0,0,0,0.95),
        0 0 30px rgba(0,0,0,0.6);
    }
    .vs__alt small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 74px;
      font-weight: 700;
      margin-left: 4px;
      color: var(--c);
      text-shadow: 0 4px 10px rgba(0,0,0,0.95);
    }

    /* ── Transition vers le winner ───────────────────────────────────── */

    /* Le perdant: fade out + collapse de l'espace flex */
    .vs__player.vs--lose {
      animation: vsLose 0.7s ease forwards;
      overflow: hidden;
    }
    @keyframes vsLose {
      0%   { opacity: 1; max-width: 500px; margin: 0; transform: scale(1); filter: blur(0); }
      40%  { opacity: 0; transform: scale(0.7); filter: blur(6px); }
      100% { opacity: 0; max-width: 0;   margin: 0 -50px; transform: scale(0.4); filter: blur(8px); }
    }

    /* Le gagnant: scale up centre (le flex le recentre grace au collapse du loser) */
    .vs__player.vs--win {
      animation: vsWin 0.9s 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes vsWin {
      from { transform: scale(1); }
      to   { transform: scale(1.4); }
    }

    /* Halo soft autour du gagnant */
    .vs__player.vs--win .vs__avatar {
      animation: vsHalo 0.8s 0.6s ease forwards;
    }
    @keyframes vsHalo {
      to {
        box-shadow:
          0 0 0 4px rgba(255,255,255,0.9),
          0 0 30px rgba(255,255,255,0.5),
          0 0 60px rgba(255,255,255,0.25),
          0 10px 32px rgba(0,0,0,0.85);
      }
    }

    /* =========================================================================
       STYLE: DELTA — DA de base (transparent, sans carte)
       PP adversaire + arrow + chiffre + label, comme duo style.
       ========================================================================= */
    .delta {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* PP adversaire (meme style que duo) */
    .delta__pp {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      box-shadow: 0 6px 22px rgba(0,0,0,0.75), 0 2px 6px rgba(0,0,0,0.55);
    }
    .delta__pp img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .delta__main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Chiffre - meme typo que duo: chiffre blanc + unite color */
    .delta__row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .delta__sign {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 84px;
      line-height: 0.85;
      letter-spacing: -0.04em;
      transition: color 0.4s, text-shadow 0.4s;
    }
    .delta.ahead  .delta__sign { color: var(--a); text-shadow: var(--shadow), 0 0 18px var(--a-glow); }
    .delta.behind .delta__sign { color: var(--b); text-shadow: var(--shadow), 0 0 18px var(--b-glow); }
    .delta.tied   .delta__sign { color: rgba(255,255,255,0.4); font-size: 60px; }

    .delta__num {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 84px;
      line-height: 0.85;
      color: #fff;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .delta__unit {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 0.85;
      transition: color 0.4s, text-shadow 0.4s;
    }
    .delta.ahead  .delta__unit { color: var(--a); text-shadow: var(--shadow), 0 0 14px var(--a-glow); }
    .delta.behind .delta__unit { color: var(--b); text-shadow: var(--shadow), 0 0 14px var(--b-glow); }
    .delta.tied   .delta__unit { color: rgba(255,255,255,0.4); }

    .delta__label {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.92);
      text-transform: lowercase;
      text-shadow: var(--shadow);
    }

    /* ========== FLASH + SHAKE ========== */
    @keyframes leadEnter {
      0%   { opacity: 0; transform: translateY(-6px); }
      18%  { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    .flash {
      position: fixed;
      top: 6px; left: 0; right: 0;
      text-align: center;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      pointer-events: none;
      animation: leadEnter 2.8s ease forwards;
      z-index: 999;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      30%      { transform: translateX(-3px); }
      60%      { transform: translateX(3px); }
    }
    .shaking { animation: shake 0.3s ease; }
  </style>
</head>
<body>

<!-- ── DUO ── -->
<div class="duo" id="duo">
  <div class="player" data-p="a" id="duo-a">
    <div class="avatar"><img id="duo-img-a" alt=""></div>
    <div class="info">
      <div class="info__alt"><span id="duo-num-a">0</span><small>m</small></div>
      <div class="info__name" id="duo-name-a">el_matte0</div>
    </div>
  </div>
  <div class="player" data-p="b" id="duo-b">
    <div class="avatar"><img id="duo-img-b" alt=""></div>
    <div class="info">
      <div class="info__alt"><span id="duo-num-b">0</span><small>m</small></div>
      <div class="info__name" id="duo-name-b">tvabdou</div>
    </div>
  </div>
</div>

<!-- ── SOLO ── -->
<div class="solo hidden" id="solo">
  <div class="avatar"><img id="solo-img" alt=""></div>
  <div class="info">
    <div class="info__alt"><span id="solo-num">0</span><small>m</small></div>
    <div class="info__name" id="solo-name">player</div>
    <div class="info__meta">
      <div class="meta-cell">
        <div class="meta-cell__num"><span id="solo-peak">0</span><small>m</small></div>
        <div class="meta-cell__label">peak</div>
      </div>
      <div class="meta-divider"></div>
      <div class="meta-cell">
        <div class="meta-cell__num"><span id="solo-falls">0</span></div>
        <div class="meta-cell__label">falls</div>
      </div>
    </div>
  </div>
</div>

<!-- ── SCOREBUG ── -->
<div class="scorebug hidden" id="scorebug">
  <div class="scorebug__side scorebug__side--a">
    <div class="scorebug__avatar"><img id="sb-img-a" alt=""></div>
    <div class="scorebug__name" id="sb-name-a">el_matte0</div>
  </div>
  <div class="scorebug__score">
    <div class="scorebug__num scorebug__num--a" id="sb-num-a">0</div>
    <div class="scorebug__sep">—</div>
    <div class="scorebug__num scorebug__num--b" id="sb-num-b">0</div>
  </div>
  <div class="scorebug__side scorebug__side--b">
    <div class="scorebug__avatar"><img id="sb-img-b" alt=""></div>
    <div class="scorebug__name" id="sb-name-b">tvabdou</div>
  </div>
</div>

<!-- ── DELTA (perspective overlay) ── -->
<div class="delta hidden tied" id="delta">
  <div class="delta__pp"><img id="delta-pp" alt=""></div>
  <div class="delta__main">
    <div class="delta__row">
      <span class="delta__sign" id="delta-sign">=</span>
      <span class="delta__num" id="delta-num">0</span>
      <span class="delta__unit">m</span>
    </div>
    <div class="delta__label" id="delta-label">égalité</div>
  </div>
</div>

<!-- ── VS ── -->
<div class="vs hidden" id="vs">
  <div class="vs__player vs__player--a">
    <div class="vs__avatar"><img id="vs-img-a" alt=""></div>
    <div class="vs__alt"><span id="vs-num-a">0</span><small>m</small></div>
  </div>
  <div class="vs__player vs__player--b">
    <div class="vs__avatar"><img id="vs-img-b" alt=""></div>
    <div class="vs__alt"><span id="vs-num-b">0</span><small>m</small></div>
  </div>
</div>

<!-- ── BANNER ── -->
<div class="banner hidden" id="banner">
  <div class="banner__side banner__side--a">
    <div class="banner__avatar"><img id="bn-img-a" alt=""></div>
    <div class="banner__info">
      <div class="banner__name" id="bn-name-a">el_matte0</div>
      <div class="banner__alt"><span id="bn-num-a">0</span><small>m</small></div>
      <div class="banner__stats">peak <strong id="bn-peak-a">0</strong>m · <strong id="bn-falls-a">0</strong> falls</div>
    </div>
  </div>
  <div class="banner__vs">
    <div class="banner__vs-label">vs</div>
    <div class="banner__delta" id="bn-delta">0</div>
    <div class="banner__delta-label" id="bn-delta-label">tied</div>
  </div>
  <div class="banner__side banner__side--b">
    <div class="banner__avatar"><img id="bn-img-b" alt=""></div>
    <div class="banner__info">
      <div class="banner__name" id="bn-name-b">tvabdou</div>
      <div class="banner__alt"><span id="bn-num-b">0</span><small>m</small></div>
      <div class="banner__stats">peak <strong id="bn-peak-b">0</strong>m · <strong id="bn-falls-b">0</strong> falls</div>
    </div>
  </div>
</div>

<script>
  // =========================================================================
  // CONFIG
  // =========================================================================
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');         // 'playerA' | 'playerB' | null
  const STYLE       = params.get('style') || (SOLO_PLAYER ? 'solo' : 'duo');

  const TWITCH_A = params.get('twitchA') || 'el_matte0';
  const TWITCH_B = params.get('twitchB') || 'tvabdou';

  // ── Scaling factor: raw save units per displayed metre ──
  // 30 = calibre sur retour utilisateur (~3m par pas, 18 pas = 50m). Override via ?scale=X
  const SCALE = Math.max(1, parseFloat(params.get('scale')) || 30);
  const toM = (v) => Math.round((v || 0) / SCALE);

  // =========================================================================
  // SHOW THE RIGHT LAYOUT
  // =========================================================================
  document.getElementById('duo').classList.toggle('hidden',      STYLE !== 'duo');
  document.getElementById('solo').classList.toggle('hidden',     STYLE !== 'solo');
  document.getElementById('scorebug').classList.toggle('hidden', STYLE !== 'scorebug');
  document.getElementById('banner').classList.toggle('hidden',   STYLE !== 'banner');
  document.getElementById('vs').classList.toggle('hidden',       STYLE !== 'vs');
  document.getElementById('delta').classList.toggle('hidden',    STYLE !== 'delta');

  // Solo: choose player A or B
  if (STYLE === 'solo') {
    const pid = SOLO_PLAYER || 'playerA';
    document.getElementById('solo').dataset.p = pid === 'playerA' ? 'a' : 'b';
  }

  // =========================================================================
  // LOAD TWITCH AVATARS (in 600x600 for HiDPI)
  // =========================================================================
  loadTwitchAvatar(TWITCH_A, [
    'duo-img-a', 'sb-img-a', 'bn-img-a', 'vs-img-a',
    STYLE === 'solo'  && SOLO_PLAYER === 'playerA' ? 'solo-img'  : null,
    STYLE === 'delta' && SOLO_PLAYER === 'playerB' ? 'delta-pp' : null   // PP de l'adversaire (A)
  ]);
  loadTwitchAvatar(TWITCH_B, [
    'duo-img-b', 'sb-img-b', 'bn-img-b', 'vs-img-b',
    STYLE === 'solo'  && SOLO_PLAYER === 'playerB' ? 'solo-img'  : null,
    STYLE === 'delta' && (SOLO_PLAYER || 'playerA') === 'playerA' ? 'delta-pp' : null   // PP de l'adversaire (B par defaut)
  ]);

  // Set pseudonyms across all layouts
  setText('duo-name-a', TWITCH_A); setText('duo-name-b', TWITCH_B);
  setText('sb-name-a',  TWITCH_A); setText('sb-name-b',  TWITCH_B);
  setText('bn-name-a',  TWITCH_A); setText('bn-name-b',  TWITCH_B);
  if (STYLE === 'solo') setText('solo-name', SOLO_PLAYER === 'playerB' ? TWITCH_B : TWITCH_A);

  function loadTwitchAvatar(username, imgIds) {
    fetch('https://decapi.me/twitch/avatar/' + encodeURIComponent(username))
      .then(r => r.text())
      .then(url => {
        if (!url || !url.startsWith('http')) return;
        const hiRes = url.replace(/-\d+x\d+(\.\w+)$/, '-600x600$1');
        imgIds.filter(Boolean).forEach(id => {
          const el = document.getElementById(id);
          if (el) el.src = hiRes;
        });
      })
      .catch(() => {});
  }

  // =========================================================================
  // SOCKET
  // =========================================================================
  const socket = io(window.location.origin);
  socket.on('state_sync', applyState);
  socket.on('lead_change', ({ leader, state }) => { applyState(state); flashLead(leader, state); });
  socket.on('fall', ({ playerId }) => { shakeFall(playerId); });

  function applyState(s) {
    const a = s.playerA, b = s.playerB;
    const aH = toM(a.height);
    const bH = toM(b.height);

    // duo
    setNumSmooth('duo-num-a', aH);
    setNumSmooth('duo-num-b', bH);

    // solo
    if (STYLE === 'solo') {
      const p = SOLO_PLAYER === 'playerB' ? b : a;
      setNumSmooth('solo-num',  toM(p.height));
      setNumSmooth('solo-peak', toM(p.maxHeight));
      setText('solo-falls', p.falls);
    }

    // scorebug
    setNumSmooth('sb-num-a', aH);
    setNumSmooth('sb-num-b', bH);

    // vs — counter monte dramatiquement puis reveal du gagnant
    if (STYLE === 'vs') {
      setNumSmoothSlow('vs-num-a', aH);
      setNumSmoothSlow('vs-num-b', bH);
      maybeRevealWinner(aH, bH);
    }

    // delta (perspective overlay)
    if (STYLE === 'delta') {
      const isA  = (SOLO_PLAYER || 'playerA') === 'playerA';
      const me   = isA ? aH       : bH;
      const opp  = isA ? bH       : aH;
      const oppN = isA ? TWITCH_B : TWITCH_A;
      const diff = me - opp;
      const root  = document.getElementById('delta');
      const sign  = document.getElementById('delta-sign');
      const label = document.getElementById('delta-label');

      root.classList.remove('ahead', 'behind', 'tied');
      if (diff === 0) {
        root.classList.add('tied');
        sign.textContent = '=';
        setNumSmooth('delta-num', 0);
        label.textContent = 'égalité avec ' + oppN;
      } else if (diff > 0) {
        root.classList.add('ahead');
        sign.textContent = '+';
        setNumSmooth('delta-num', diff);
        label.textContent = "d'avance sur " + oppN;
      } else {
        root.classList.add('behind');
        sign.textContent = '−';
        setNumSmooth('delta-num', Math.abs(diff));
        label.textContent = 'de retard sur ' + oppN;
      }
    }

    // banner
    setNumSmooth('bn-num-a', aH);
    setNumSmooth('bn-num-b', bH);
    setNumSmooth('bn-peak-a', toM(a.maxHeight));
    setNumSmooth('bn-peak-b', toM(b.maxHeight));
    setText('bn-falls-a', a.falls);
    setText('bn-falls-b', b.falls);

    const diff = aH - bH;
    const dEl = document.getElementById('bn-delta');
    const dlEl = document.getElementById('bn-delta-label');
    if (dEl && dlEl) {
      if (diff === 0) {
        dEl.textContent = '0';
        dEl.style.color = '#fff';
        dlEl.textContent = 'tied';
        dlEl.style.color = 'rgba(255,255,255,0.4)';
      } else if (diff > 0) {
        dEl.textContent = '+' + Math.abs(diff);
        dEl.style.color = 'var(--a)';
        dEl.style.textShadow = '0 0 12px var(--a-glow)';
        dlEl.textContent = TWITCH_A;
        dlEl.style.color = 'var(--a)';
      } else {
        dEl.textContent = '+' + Math.abs(diff);
        dEl.style.color = 'var(--b)';
        dEl.style.textShadow = '0 0 12px var(--b-glow)';
        dlEl.textContent = TWITCH_B;
        dlEl.style.color = 'var(--b)';
      }
    }
  }

  function flashLead(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    if (leader === 'tie') return;
    const name  = leader === 'playerA' ? TWITCH_A : TWITCH_B;
    const color = leader === 'playerA' ? '#22d3ee' : '#fbbf24';
    const glow  = leader === 'playerA' ? 'rgba(34,211,238,0.6)' : 'rgba(251,191,36,0.6)';
    const d = document.createElement('div');
    d.className = 'flash';
    d.style.color = color;
    d.style.textShadow = '0 0 14px ' + glow + ', 0 2px 8px rgba(0,0,0,0.95)';
    d.textContent = '↑ ' + name + ' leads';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2900);
  }

  function shakeFall(playerId) {
    // Shake the relevant card depending on the active style
    const targets = [];
    if (STYLE === 'duo')      targets.push(playerId === 'playerA' ? 'duo-a' : 'duo-b');
    if (STYLE === 'solo')     targets.push('solo');
    if (STYLE === 'scorebug') targets.push('scorebug');
    if (STYLE === 'banner')   targets.push('banner');
    targets.forEach(id => {
      const n = document.getElementById(id);
      if (!n) return;
      n.classList.add('shaking');
      setTimeout(() => n.classList.remove('shaking'), 320);
    });
  }

  function setText(id, t) { const n = document.getElementById(id); if (n) n.textContent = t; }

  // ── Reveal du gagnant (VS style) : appele une seule fois apres l'anim ──
  let vsRevealed = false;
  function maybeRevealWinner(aH, bH) {
    if (vsRevealed) return;
    if (aH === 0 && bH === 0) return;   // attendre des vraies donnees
    if (aH === bH) return;              // pas de gagnant si egalite
    vsRevealed = true;

    // Attendre la fin de l'animation des chiffres (1.8s) + petite pause
    setTimeout(() => {
      const playerA = document.querySelector('.vs__player--a');
      const playerB = document.querySelector('.vs__player--b');
      if (!playerA || !playerB) return;
      if (aH > bH) {
        playerA.classList.add('vs--win');
        playerB.classList.add('vs--lose');
      } else {
        playerB.classList.add('vs--win');
        playerA.classList.add('vs--lose');
      }
    }, 2400);
  }

  // ── Smooth number tween: anime de la valeur actuelle vers la nouvelle ──
  const tweens = {};  // id => {raf, from, to, start}
  const TWEEN_MS = 500;
  function setNumSmooth(id, target) { _tween(id, target, 500); }
  function setNumSmoothSlow(id, target) {
    const n = document.getElementById(id);
    if (!n) return;
    // Premier appel: animer de 0 vers target en 1.8s (effet dramatique d'entree)
    const cur = Number(n.textContent.replace(/\D/g, '')) || 0;
    const dur = (cur === 0 && target > 0) ? 1800 : 500;
    _tween(id, target, dur);
  }
  function _tween(id, target, duration) {
    const n = document.getElementById(id);
    if (!n) return;
    target = Number(target) || 0;
    const current = Number(n.textContent.replace(/\D/g, '')) || 0;
    if (current === target) return;
    if (tweens[id]) cancelAnimationFrame(tweens[id].raf);
    const start = performance.now();
    const from  = current;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
      const val = Math.round(from + (target - from) * eased);
      n.textContent = val;
      if (t < 1) tweens[id] = { raf: requestAnimationFrame(step), from, to: target, start };
      else delete tweens[id];
    };
    tweens[id] = { raf: requestAnimationFrame(step), from, to: target, start };
  }
</script>
</body>
</html>
