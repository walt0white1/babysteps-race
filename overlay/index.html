<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@200..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       BABY STEPS — Pill-bar altimeter
       Bar = container. Number inside top. Rotated label on right.
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:      #22d3ee;
      --a-deep: #155e75;
      --a-glow: rgba(34, 211, 238, 0.6);

      --b:      #fbbf24;
      --b-deep: #78350f;
      --b-glow: rgba(251, 191, 36, 0.6);

      --shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.7);
    }

    html, body {
      background: transparent;
      width: 100%; height: 100%;
      overflow: hidden;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
      min-height: 100vh;
      padding: 20px;
    }

    /* ========== PLAYER ========== */
    .player {
      --c:      var(--a);
      --c-deep: var(--a-deep);
      --c-glow: var(--a-glow);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .player[data-p="b"] {
      --c:      var(--b);
      --c-deep: var(--b-deep);
      --c-glow: var(--b-glow);
    }

    /* Name above the bar */
    .p-name {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 22px;
      color: var(--c);
      text-shadow: var(--shadow);
      font-variation-settings: "opsz" 144;
      letter-spacing: -0.005em;
      line-height: 1;
    }

    /* Bar + label container */
    .stack {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    /* ========== THE BAR (= the visual hero) ========== */
    .bar {
      width: 84px;
      height: 380px;
      border-radius: 42px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, #14181f 0%, #0a0d12 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.5),
        inset 0 0 0 1px rgba(255,255,255,0.05),
        0 8px 24px rgba(0,0,0,0.6),
        0 2px 6px rgba(0,0,0,0.4);
    }

    /* The fill that rises */
    .bar__fill {
      position: absolute;
      left: 4px; right: 4px; bottom: 4px;
      height: 0%;
      border-radius: 38px;
      background:
        linear-gradient(180deg,
          color-mix(in srgb, var(--c) 110%, white 12%) 0%,
          var(--c) 12%,
          color-mix(in srgb, var(--c) 75%, var(--c-deep)) 45%,
          var(--c-deep) 100%);
      transition: height 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.3),
        0 -6px 20px var(--c-glow),
        0 -2px 8px var(--c-glow);
    }

    /* Vertical glass highlight on fill */
    .bar__fill::before {
      content: '';
      position: absolute;
      top: 6px; bottom: 6px;
      left: 10px;
      width: 10px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.05) 100%);
      border-radius: 5px;
      pointer-events: none;
    }

    /* Bright meniscus line at top of fill */
    .bar__fill::after {
      content: '';
      position: absolute;
      top: -1px; left: 0; right: 0;
      height: 2px;
      background: rgba(255,255,255,0.9);
      box-shadow:
        0 0 10px var(--c),
        0 0 20px var(--c-glow);
      border-radius: 2px;
    }

    /* Record marker (white horizontal line) */
    .bar__rec {
      position: absolute;
      left: 0; right: 0;
      height: 1.5px;
      background: rgba(255,255,255,0.55);
      box-shadow: 0 0 4px rgba(255,255,255,0.4);
      transition: bottom 0.55s ease;
      z-index: 3;
      pointer-events: none;
    }
    .bar__rec::before {
      content: '';
      position: absolute;
      left: -3px; top: -3.5px;
      width: 0; height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 5px solid rgba(255,255,255,0.8);
    }

    /* CURRENT ALTITUDE — inside top of bar */
    .bar__readout {
      position: absolute;
      top: 16px; left: 0; right: 0;
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }
    .bar__num {
      font-family: 'Antonio', sans-serif;
      font-weight: 400;
      font-size: 40px;
      line-height: 0.9;
      color: #fff;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 1px 4px rgba(0,0,0,0.9),
        0 0 12px rgba(0,0,0,0.6);
    }
    .bar__num--small { font-size: 30px; }
    .bar__sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.55);
      margin-top: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    /* ========== ROTATED LABEL on right side of bar ========== */
    .label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.35em;
      color: #fff;
      text-shadow: var(--shadow);
      text-transform: uppercase;
      align-self: center;
      white-space: nowrap;
    }

    /* Falls below */
    .p-falls {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-shadow: var(--shadow);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .p-falls strong {
      font-family: 'Antonio', sans-serif;
      font-weight: 500;
      font-size: 18px;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes leadEnter {
      0%   { opacity: 0; transform: translateY(-8px); }
      18%  { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    .lead-flash {
      position: fixed;
      top: 12px; left: 0; right: 0;
      text-align: center;
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      pointer-events: none;
      animation: leadEnter 3s ease forwards;
      z-index: 999;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-3px); }
      40%      { transform: translateX(3px); }
      60%      { transform: translateX(-2px); }
      80%      { transform: translateX(2px); }
    }
    .player.shaking { animation: shake 0.4s ease; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── PLAYER A ── -->
  <div class="player" data-p="a" id="p-a">
    <div class="p-name" id="name-a">Matteo</div>
    <div class="stack">
      <div class="bar">
        <div class="bar__fill" id="fill-a" style="height:0%"></div>
        <div class="bar__rec" id="rec-a" style="bottom:0%"></div>
        <div class="bar__readout">
          <div class="bar__num" id="num-a">0</div>
          <div class="bar__sub">/<span id="peak-a">0</span> peak</div>
        </div>
      </div>
      <div class="label">Baby Steps</div>
    </div>
    <div class="p-falls"><strong id="falls-a">0</strong>falls</div>
  </div>

  <!-- ── PLAYER B ── -->
  <div class="player" data-p="b" id="p-b">
    <div class="p-name" id="name-b">Abdou</div>
    <div class="stack">
      <div class="bar">
        <div class="bar__fill" id="fill-b" style="height:0%"></div>
        <div class="bar__rec" id="rec-b" style="bottom:0%"></div>
        <div class="bar__readout">
          <div class="bar__num" id="num-b">0</div>
          <div class="bar__sub">/<span id="peak-b">0</span> peak</div>
        </div>
      </div>
      <div class="label">Baby Steps</div>
    </div>
    <div class="p-falls"><strong id="falls-b">0</strong>falls</div>
  </div>

<script>
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');
  const MAX_H       = 1200;

  if (SOLO_PLAYER === 'playerA') el('p-b').classList.add('hidden');
  else if (SOLO_PLAYER === 'playerB') el('p-a').classList.add('hidden');

  const socket = io(window.location.origin);
  socket.on('state_sync', applyState);
  socket.on('lead_change', ({ leader, state }) => { applyState(state); flashLead(leader, state); });
  socket.on('fall', ({ playerId }) => { shakeFall(playerId); });

  function applyState(s) {
    const a = s.playerA, b = s.playerB;

    setText('name-a', a.name || 'Matteo');
    setText('name-b', b.name || 'Abdou');

    setNum('num-a', a.height);
    setNum('num-b', b.height);
    setText('peak-a', Math.round(a.maxHeight));
    setText('peak-b', Math.round(b.maxHeight));
    setText('falls-a', String(a.falls));
    setText('falls-b', String(b.falls));

    const top   = Math.max(a.height, b.height, a.maxHeight, b.maxHeight, 1);
    const scale = Math.max(top * 1.05, MAX_H * 0.08);

    el('fill-a').style.height = pct(a.height,    scale) + '%';
    el('fill-b').style.height = pct(b.height,    scale) + '%';
    el('rec-a').style.bottom  = pct(a.maxHeight, scale) + '%';
    el('rec-b').style.bottom  = pct(b.maxHeight, scale) + '%';
  }

  function flashLead(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    if (leader === 'tie') return;
    const name  = leader === 'playerA' ? (state.playerA.name || 'Matteo') : (state.playerB.name || 'Abdou');
    const color = leader === 'playerA' ? '#22d3ee' : '#fbbf24';
    const glow  = leader === 'playerA' ? 'rgba(34,211,238,0.6)' : 'rgba(251,191,36,0.6)';
    const d = document.createElement('div');
    d.className = 'lead-flash';
    d.style.color = color;
    d.style.textShadow = '0 0 18px ' + glow + ', 0 2px 10px rgba(0,0,0,0.95)';
    d.textContent = '↑  ' + name + ' takes the lead';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3100);
  }

  function shakeFall(playerId) {
    const id = playerId === 'playerA' ? 'p-a' : 'p-b';
    const n = el(id);
    if (!n) return;
    n.classList.add('shaking');
    setTimeout(() => n.classList.remove('shaking'), 420);
  }

  function pct(v, m)      { return Math.min(100, Math.max(0, (v / m) * 100)).toFixed(2); }
  function el(id)         { return document.getElementById(id); }
  function setText(id, t) { const n = el(id); if (n) n.textContent = t; }
  function setNum(id, v) {
    const n = el(id); if (!n) return;
    const r = Math.round(v);
    n.textContent = r;
    n.classList.toggle('bar__num--small', String(r).length >= 4);
  }
</script>
</body>
</html>
