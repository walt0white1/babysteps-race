<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=JetBrains+Mono:wght@500;600;700&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       BABY STEPS — MULTI-STYLE OVERLAY
       Styles available via ?style= param:
         duo       - 2 avatars + altitudes (default, vue comparative)
         opp       - adversaire seul (gros PP + altitude) — perspective stream
         falls     - nombre de chutes de l'adversaire — perspective stream
         delta     - "+X m d'avance sur Y" — perspective stream
         solo      - 1 joueur showcase (alt + peak + falls)
         vs        - VS dramatique avec reveal du gagnant

       Perspective (perspective stream) = montre les data de l'adversaire.
       Le streamer indique son cote via ?player=playerA ou ?player=playerB.
       Sans ?player=, default = playerA (Matteo).
       Solo mode also activates with ?player=playerA or playerB
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:      #22d3ee;
      --a-glow: rgba(34, 211, 238, 0.6);
      --b:      #fbbf24;
      --b-glow: rgba(251, 191, 36, 0.6);
      --shadow: 0 2px 4px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.7);
    }

    html, body {
      background: transparent;
      width: 100%; height: 100%;
      overflow: hidden;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
    }

    img {
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      min-height: 100vh;
      padding: 20px 24px;
      font-family: 'JetBrains Mono', monospace;
    }

    .hidden { display: none !important; }

    /* ========== ROTATION : fade transitions entre overlays ========== */
    .cycle-stage {
      position: relative;
    }
    .cycle-stage > * {
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    .cycle-stage > .fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* =========================================================================
       STYLE: DUO (default) — 2 avatars side by side (compact pour coin OBS)
       ========================================================================= */
    .duo {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .duo .player {
      --c:      var(--a);
      --c-glow: var(--a-glow);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .duo .player[data-p="b"] {
      --c:      var(--b);
      --c-glow: var(--b-glow);
    }
    .duo .avatar {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.75), 0 2px 6px rgba(0,0,0,0.55);
    }
    .duo .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .duo .info__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 52px;
      line-height: 0.85;
      color: #fff;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .duo .info__alt small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--c);
      margin-left: 2px;
      text-shadow: var(--shadow), 0 0 10px var(--c-glow);
    }
    .duo .info__name { display: none; }

    /* =========================================================================
       STYLE: SOLO — single player big showcase
       ========================================================================= */
    .solo {
      display: flex;
      align-items: flex-start;
      gap: 26px;
      --c:      var(--a);
      --c-glow: var(--a-glow);
    }
    .solo .info { padding-top: 8px; }
    .solo[data-p="b"] {
      --c:      var(--b);
      --c-glow: var(--b-glow);
    }
    .solo .avatar {
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      box-shadow: 0 8px 28px rgba(0,0,0,0.8), 0 2px 8px rgba(0,0,0,0.6);
    }
    .solo .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .solo .info__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 120px;
      line-height: 0.82;
      color: #fff;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .solo .info__alt small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--c);
      margin-left: 6px;
      text-shadow: var(--shadow), 0 0 16px var(--c-glow);
    }
    .solo .info__name {
      font-family: 'Montserrat', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.005em;
      color: var(--c);
      text-shadow: var(--shadow), 0 0 16px var(--c-glow);
      margin-top: 10px;
    }
    /* Solo stats panel — two cells separated by a thin divider */
    .solo .info__meta {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 16px;
    }
    .meta-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .meta-cell__num {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 34px;
      line-height: 0.9;
      color: #fff;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .meta-cell__num small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--c);
      margin-left: 2px;
      text-shadow: var(--shadow), 0 0 10px var(--c-glow);
    }
    .meta-cell__label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-shadow: var(--shadow);
    }
    .meta-divider {
      width: 1px;
      height: 38px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.18), transparent);
    }

    /* =========================================================================
       STYLE: OPP — adversaire seul (compact)
       ========================================================================= */
    .opp {
      display: flex;
      align-items: center;
      gap: 16px;
      --c: var(--a);
      --c-glow: var(--a-glow);
    }
    .opp[data-p="b"] { --c: var(--b); --c-glow: var(--b-glow); }

    .opp__avatar {
      width: 78px; height: 78px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      box-shadow: 0 5px 18px rgba(0,0,0,0.8), 0 2px 6px rgba(0,0,0,0.6);
    }
    .opp__avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .opp__info { display: flex; flex-direction: column; }
    .opp__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 64px;
      line-height: 0.82;
      color: #fff;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .opp__alt small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--c);
      margin-left: 2px;
      text-shadow: var(--shadow), 0 0 12px var(--c-glow);
    }
    .opp__who { display: none; }

    /* =========================================================================
       STYLE: FALLS — pictogramme de chute + nombre
       ========================================================================= */
    .falls {
      display: flex;
      align-items: center;
      gap: 14px;
      --c: var(--a);
      --c-glow: var(--a-glow);
    }
    .falls[data-p="b"] { --c: var(--b); --c-glow: var(--b-glow); }

    /* Pictogramme chute - image masquee + couleur joueur */
    .falls__icon {
      width: 90px;
      height: 90px;
      background-color: var(--c);
      -webkit-mask: url('fezfgzeg.png') center/contain no-repeat;
              mask: url('fezfgzeg.png') center/contain no-repeat;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.9))
              drop-shadow(0 0 14px var(--c-glow));
      animation: fallShake 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes fallShake {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      30%      { transform: translateY(-2px) rotate(-3deg); }
      60%      { transform: translateY(2px)  rotate(2deg); }
    }

    .falls__info { display: flex; flex-direction: column; }
    .falls__row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .falls__num {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 76px;
      line-height: 0.82;
      color: #fff;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .falls__unit {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--c);
      text-shadow: var(--shadow), 0 0 12px var(--c-glow);
    }
    .falls__who {
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.005em;
      color: var(--c);
      text-shadow: var(--shadow), 0 0 10px var(--c-glow);
      margin-top: 4px;
    }

    /* =========================================================================
       STYLE: VS — clean, big, punchy
       ========================================================================= */
    .vs {
      display: flex;
      align-items: center;
      gap: 100px;
    }

    .vs__player {
      --c: var(--a);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: vsPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    }
    .vs__player--b {
      --c: var(--b);
      animation-delay: 0.15s;
    }
    @keyframes vsPop {
      from { opacity: 0; transform: scale(0.6); }
      60%  { opacity: 1; transform: scale(1.06); }
      to   { opacity: 1; transform: scale(1); }
    }

    .vs__avatar {
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      overflow: hidden;
      box-shadow: 0 10px 32px rgba(0,0,0,0.85), 0 3px 8px rgba(0,0,0,0.6);
    }
    .vs__avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }

    .vs__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 150px;
      line-height: 0.82;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
      color: #fff;
      text-shadow:
        0 4px 10px rgba(0,0,0,0.95),
        0 0 30px rgba(0,0,0,0.6);
    }
    .vs__alt small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 74px;
      font-weight: 700;
      margin-left: 4px;
      color: var(--c);
      text-shadow: 0 4px 10px rgba(0,0,0,0.95);
    }

    /* ── Transition vers le winner ───────────────────────────────────── */

    /* Le perdant: fade out + collapse de l'espace flex */
    .vs__player.vs--lose {
      animation: vsLose 0.7s ease forwards;
      overflow: hidden;
    }
    @keyframes vsLose {
      0%   { opacity: 1; max-width: 500px; margin: 0; transform: scale(1); filter: blur(0); }
      40%  { opacity: 0; transform: scale(0.7); filter: blur(6px); }
      100% { opacity: 0; max-width: 0;   margin: 0 -50px; transform: scale(0.4); filter: blur(8px); }
    }

    /* Le gagnant: scale up centre (le flex le recentre grace au collapse du loser) */
    .vs__player.vs--win {
      animation: vsWin 0.9s 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes vsWin {
      from { transform: scale(1); }
      to   { transform: scale(1.4); }
    }

    /* Halo soft autour du gagnant */
    .vs__player.vs--win .vs__avatar {
      animation: vsHalo 0.8s 0.6s ease forwards;
    }
    @keyframes vsHalo {
      to {
        box-shadow:
          0 0 0 4px rgba(255,255,255,0.9),
          0 0 30px rgba(255,255,255,0.5),
          0 0 60px rgba(255,255,255,0.25),
          0 10px 32px rgba(0,0,0,0.85);
      }
    }

    /* =========================================================================
       STYLE: DELTA — DA de base (transparent, sans carte)
       PP adversaire + arrow + chiffre + label, comme duo style.
       ========================================================================= */
    .delta {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* PP adversaire (compact) */
    .delta__pp {
      width: 68px; height: 68px;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.75), 0 2px 6px rgba(0,0,0,0.55);
    }
    .delta__pp img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .delta__main {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Chiffre - meme typo que duo: chiffre blanc + unite color */
    .delta__row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .delta__sign {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 52px;
      line-height: 0.85;
      letter-spacing: -0.04em;
      transition: color 0.4s, text-shadow 0.4s;
    }
    /* Sign + unit = couleur du viewer (data-me) */
    .delta[data-me="a"] .delta__sign { color: var(--a); text-shadow: var(--shadow), 0 0 14px var(--a-glow); }
    .delta[data-me="b"] .delta__sign { color: var(--b); text-shadow: var(--shadow), 0 0 14px var(--b-glow); }
    .delta.tied .delta__sign { color: rgba(255,255,255,0.4); font-size: 38px; text-shadow: var(--shadow); }

    .delta__num {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 52px;
      line-height: 0.85;
      color: #fff;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .delta__unit {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 30px;
      font-weight: 700;
      line-height: 0.85;
      transition: color 0.4s, text-shadow 0.4s;
    }
    .delta[data-me="a"] .delta__unit { color: var(--a); text-shadow: var(--shadow), 0 0 10px var(--a-glow); }
    .delta[data-me="b"] .delta__unit { color: var(--b); text-shadow: var(--shadow), 0 0 10px var(--b-glow); }
    .delta.tied .delta__unit { color: rgba(255,255,255,0.4); }

    .delta__label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: -0.005em;
      color: rgba(255,255,255,0.85);
      text-shadow: var(--shadow);
    }
    /* Pseudo adversaire en blanc - une seule couleur d'accent (celle du viewer) */
    .delta__label-opp {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #fff;
      text-shadow: var(--shadow);
    }

    /* ========== FLASH + SHAKE ========== */
    @keyframes leadEnter {
      0%   { opacity: 0; transform: translateY(-6px); }
      18%  { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    .flash {
      position: fixed;
      top: 6px; left: 0; right: 0;
      text-align: center;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      pointer-events: none;
      animation: leadEnter 2.8s ease forwards;
      z-index: 999;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      30%      { transform: translateX(-3px); }
      60%      { transform: translateX(3px); }
    }
    .shaking { animation: shake 0.3s ease; }
  </style>
</head>
<body>

<!-- ── DUO ── -->
<div class="duo" id="duo">
  <div class="player" data-p="a" id="duo-a">
    <div class="avatar"><img id="duo-img-a" alt=""></div>
    <div class="info">
      <div class="info__alt"><span id="duo-num-a">0</span><small>m</small></div>
      <div class="info__name" id="duo-name-a">el_matte0</div>
    </div>
  </div>
  <div class="player" data-p="b" id="duo-b">
    <div class="avatar"><img id="duo-img-b" alt=""></div>
    <div class="info">
      <div class="info__alt"><span id="duo-num-b">0</span><small>m</small></div>
      <div class="info__name" id="duo-name-b">tvabdou</div>
    </div>
  </div>
</div>

<!-- ── SOLO ── -->
<div class="solo hidden" id="solo">
  <div class="avatar"><img id="solo-img" alt=""></div>
  <div class="info">
    <div class="info__alt"><span id="solo-num">0</span><small>m</small></div>
    <div class="info__name" id="solo-name">player</div>
    <div class="info__meta">
      <div class="meta-cell">
        <div class="meta-cell__num"><span id="solo-peak">0</span><small>m</small></div>
        <div class="meta-cell__label">peak</div>
      </div>
      <div class="meta-divider"></div>
      <div class="meta-cell">
        <div class="meta-cell__num"><span id="solo-falls">0</span></div>
        <div class="meta-cell__label">falls</div>
      </div>
    </div>
  </div>
</div>

<!-- ── OPP : adversaire seul ── -->
<div class="opp hidden" id="opp">
  <div class="opp__avatar"><img id="opp-img" alt=""></div>
  <div class="opp__info">
    <div class="opp__alt"><span id="opp-num">0</span><small>m</small></div>
    <div class="opp__who" id="opp-who">tvabdou</div>
  </div>
</div>

<!-- ── FALLS : nombre de chutes de l'adversaire ── -->
<div class="falls hidden" id="falls">
  <div class="falls__icon"></div>
  <div class="falls__info">
    <div class="falls__row">
      <span class="falls__num" id="falls-num">0</span>
      <span class="falls__unit">chutes</span>
    </div>
    <div class="falls__who" id="falls-who">tvabdou</div>
  </div>
</div>

<!-- ── DELTA (perspective overlay) ── -->
<div class="delta hidden tied" id="delta">
  <div class="delta__pp"><img id="delta-pp" alt=""></div>
  <div class="delta__main">
    <div class="delta__row">
      <span class="delta__sign" id="delta-sign">=</span>
      <span class="delta__num" id="delta-num">0</span>
      <span class="delta__unit">m</span>
    </div>
    <div class="delta__label" id="delta-label">égalité</div>
  </div>
</div>

<!-- ── VS ── -->
<div class="vs hidden" id="vs">
  <div class="vs__player vs__player--a">
    <div class="vs__avatar"><img id="vs-img-a" alt=""></div>
    <div class="vs__alt"><span id="vs-num-a">0</span><small>m</small></div>
  </div>
  <div class="vs__player vs__player--b">
    <div class="vs__avatar"><img id="vs-img-b" alt=""></div>
    <div class="vs__alt"><span id="vs-num-b">0</span><small>m</small></div>
  </div>
</div>

<script>
  // =========================================================================
  // CONFIG
  // =========================================================================
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');         // 'playerA' | 'playerB' | null
  const CYCLE       = params.get('cycle') === '1';  // mode rotation
  const STYLE       = CYCLE ? 'cycle' : (params.get('style') || (SOLO_PLAYER ? 'solo' : 'duo'));

  const TWITCH_A = params.get('twitchA') || 'el_matte0';
  const TWITCH_B = params.get('twitchB') || 'tvabdou';

  // ── Scaling factor: raw save units per displayed metre ──
  // 30 = calibre sur retour utilisateur (~3m par pas, 18 pas = 50m). Override via ?scale=X
  const SCALE = Math.max(1, parseFloat(params.get('scale')) || 30);
  const toM = (v) => Math.round((v || 0) / SCALE);

  // =========================================================================
  // SHOW THE RIGHT LAYOUT
  // =========================================================================
  const ALL_OVERLAYS = ['duo','solo','vs','delta','opp','falls'];
  if (CYCLE) {
    ALL_OVERLAYS.forEach(id => document.getElementById(id).classList.add('hidden'));
  } else {
    ALL_OVERLAYS.forEach(id => {
      document.getElementById(id).classList.toggle('hidden', STYLE !== id);
    });
  }

  // Solo: choose player A or B
  if (STYLE === 'solo') {
    const pid = SOLO_PLAYER || 'playerA';
    document.getElementById('solo').dataset.p = pid === 'playerA' ? 'a' : 'b';
  }

  // =========================================================================
  // LOAD TWITCH AVATARS (in 600x600 for HiDPI)
  // =========================================================================
  // Perspective: le viewer (le streamer) est playerA par defaut, sinon ?player=playerB
  const viewerIsA  = (SOLO_PLAYER || 'playerA') === 'playerA';
  const oppIsA     = !viewerIsA;
  const oppName    = oppIsA ? TWITCH_A : TWITCH_B;
  // Pour opp/falls/delta, le PP affiche c'est celui de l'adversaire
  const needsOppPP = STYLE === 'delta' || STYLE === 'opp' || STYLE === 'falls' || CYCLE;

  loadTwitchAvatar(TWITCH_A, [
    'duo-img-a', 'vs-img-a',
    STYLE === 'solo' && SOLO_PLAYER === 'playerA' ? 'solo-img' : null,
    needsOppPP && oppIsA ? 'delta-pp' : null,
    needsOppPP && oppIsA ? 'opp-img'   : null,
    null
  ]);
  loadTwitchAvatar(TWITCH_B, [
    'duo-img-b', 'vs-img-b',
    STYLE === 'solo' && SOLO_PLAYER === 'playerB' ? 'solo-img' : null,
    needsOppPP && !oppIsA ? 'delta-pp' : null,
    needsOppPP && !oppIsA ? 'opp-img'   : null,
    null
  ]);

  // Set pseudonyms
  setText('duo-name-a', TWITCH_A); setText('duo-name-b', TWITCH_B);
  if (STYLE === 'solo') setText('solo-name', SOLO_PLAYER === 'playerB' ? TWITCH_B : TWITCH_A);
  // Pseudo de l'adversaire dans opp/falls
  setText('opp-who',   oppName);
  setText('falls-who', oppName);
  // Couleur dataset pour opp et falls (celle de l'adversaire)
  document.getElementById('opp').dataset.p   = oppIsA ? 'a' : 'b';
  document.getElementById('falls').dataset.p = oppIsA ? 'a' : 'b';

  function loadTwitchAvatar(username, imgIds) {
    fetch('https://decapi.me/twitch/avatar/' + encodeURIComponent(username))
      .then(r => r.text())
      .then(url => {
        if (!url || !url.startsWith('http')) return;
        const hiRes = url.replace(/-\d+x\d+(\.\w+)$/, '-600x600$1');
        imgIds.filter(Boolean).forEach(id => {
          const el = document.getElementById(id);
          if (el) el.src = hiRes;
        });
      })
      .catch(() => {});
  }

  // =========================================================================
  // SOCKET
  // =========================================================================
  const socket = io(window.location.origin);
  let lastState = null;
  socket.on('state_sync', (s) => { lastState = s; applyState(s); });
  socket.on('lead_change', ({ leader, state }) => { lastState = state; applyState(state); flashLead(leader, state); });
  socket.on('fall', ({ playerId }) => { shakeFall(playerId); });

  // Style effectif (rotation ou statique)
  function activeStyle() { return CYCLE ? (currentStyle || 'duo') : STYLE; }

  function applyState(s) {
    const STYLE = activeStyle();  // override le STYLE static en mode cycle
    const a = s.playerA, b = s.playerB;
    const aH = toM(a.height);
    const bH = toM(b.height);

    // duo
    setNumSmooth('duo-num-a', aH);
    setNumSmooth('duo-num-b', bH);

    // solo
    if (STYLE === 'solo') {
      const p = SOLO_PLAYER === 'playerB' ? b : a;
      setNumSmooth('solo-num',  toM(p.height));
      setNumSmooth('solo-peak', toM(p.maxHeight));
      setText('solo-falls', p.falls);
    }

    // opp - altitude de l'adversaire
    if (STYLE === 'opp') {
      const opp = oppIsA ? a : b;
      setNumSmooth('opp-num', toM(opp.height));
    }

    // falls - nombre de chutes de l'adversaire
    if (STYLE === 'falls') {
      const opp = oppIsA ? a : b;
      setNumSmooth('falls-num', opp.falls);
    }

    // vs — counter monte dramatiquement puis reveal du gagnant
    if (STYLE === 'vs') {
      setNumSmoothSlow('vs-num-a', aH);
      setNumSmoothSlow('vs-num-b', bH);
      maybeRevealWinner(aH, bH);
    }

    // delta (perspective overlay)
    if (STYLE === 'delta') {
      const isA  = (SOLO_PLAYER || 'playerA') === 'playerA';
      const me   = isA ? aH       : bH;
      const opp  = isA ? bH       : aH;
      const oppN = isA ? TWITCH_B : TWITCH_A;
      const diff = me - opp;
      const root  = document.getElementById('delta');
      const sign  = document.getElementById('delta-sign');
      const label = document.getElementById('delta-label');

      root.dataset.me = isA ? 'a' : 'b';
      root.classList.remove('ahead', 'behind', 'tied');

      if (diff === 0) {
        root.classList.add('tied');
        sign.textContent = '=';
        setNumSmooth('delta-num', 0);
        label.textContent = 'égalité';
      } else if (diff > 0) {
        root.classList.add('ahead');
        sign.textContent = '+';
        setNumSmooth('delta-num', diff);
        label.textContent = "d'avance";
      } else {
        root.classList.add('behind');
        sign.textContent = '−';
        setNumSmooth('delta-num', Math.abs(diff));
        label.textContent = 'de retard';
      }
    }

  }

  function flashLead(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    if (leader === 'tie') return;
    const name  = leader === 'playerA' ? TWITCH_A : TWITCH_B;
    const color = leader === 'playerA' ? '#22d3ee' : '#fbbf24';
    const glow  = leader === 'playerA' ? 'rgba(34,211,238,0.6)' : 'rgba(251,191,36,0.6)';
    const d = document.createElement('div');
    d.className = 'flash';
    d.style.color = color;
    d.style.textShadow = '0 0 14px ' + glow + ', 0 2px 8px rgba(0,0,0,0.95)';
    d.textContent = '↑ ' + name + ' leads';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2900);
  }

  function shakeFall(playerId) {
    const STYLE = activeStyle();
    const targets = [];
    if (STYLE === 'duo')  targets.push(playerId === 'playerA' ? 'duo-a' : 'duo-b');
    if (STYLE === 'solo') targets.push('solo');
    targets.forEach(id => {
      const n = document.getElementById(id);
      if (!n) return;
      n.classList.add('shaking');
      setTimeout(() => n.classList.remove('shaking'), 320);
    });
  }

  function setText(id, t) { const n = document.getElementById(id); if (n) n.textContent = t; }

  // ── ROTATION : cycle des overlays automatiquement ──
  let currentStyle = null;
  const cycleSequence = [
    { id: 'duo',   style: 'duo',   duration: 18000 },
    { id: 'opp',   style: 'opp',   duration: 14000 },
    { id: 'delta', style: 'delta', duration: 12000 },
    { id: 'falls', style: 'falls', duration: 9000  },
  ];
  let cycleIdx = 0;

  function showOverlayInCycle(item) {
    const node = document.getElementById(item.id);
    if (!node) return;

    // Reset VS pour rejouer ses animations
    if (item.style === 'vs') {
      vsRevealed = false;
      const a = document.querySelector('.vs__player--a');
      const b = document.querySelector('.vs__player--b');
      if (a) { a.classList.remove('vs--win', 'vs--lose'); a.style.animation = 'none'; a.offsetHeight; a.style.animation = ''; }
      if (b) { b.classList.remove('vs--win', 'vs--lose'); b.style.animation = 'none'; b.offsetHeight; b.style.animation = ''; }
      document.getElementById('vs-num-a').textContent = '0';
      document.getElementById('vs-num-b').textContent = '0';
    }

    // Mettre a jour le STYLE actif (pour applyState)
    currentStyle = item.style;
    node.classList.remove('hidden');
    // Force un applyState immediat pour remplir les valeurs avec le bon style
    if (lastState) applyState(lastState);
  }

  function hideOverlayInCycle(item) {
    const node = document.getElementById(item.id);
    if (node) node.classList.add('hidden');
  }

  function startCycle() {
    if (!CYCLE) return;
    const tick = () => {
      const prev = cycleSequence[(cycleIdx - 1 + cycleSequence.length) % cycleSequence.length];
      const cur  = cycleSequence[cycleIdx];
      if (cycleIdx > 0) hideOverlayInCycle(prev);
      else cycleSequence.forEach(it => hideOverlayInCycle(it));
      showOverlayInCycle(cur);
      cycleIdx = (cycleIdx + 1) % cycleSequence.length;
      setTimeout(tick, cur.duration);
    };
    tick();
  }

  // Demarrer la rotation maintenant que tout est defini
  startCycle();

  // ── Reveal du gagnant (VS style) : appele une seule fois apres l'anim ──
  let vsRevealed = false;
  function maybeRevealWinner(aH, bH) {
    if (vsRevealed) return;
    if (aH === 0 && bH === 0) return;   // attendre des vraies donnees
    if (aH === bH) return;              // pas de gagnant si egalite
    vsRevealed = true;

    // Attendre la fin de l'animation des chiffres (1.8s) + petite pause
    setTimeout(() => {
      const playerA = document.querySelector('.vs__player--a');
      const playerB = document.querySelector('.vs__player--b');
      if (!playerA || !playerB) return;
      if (aH > bH) {
        playerA.classList.add('vs--win');
        playerB.classList.add('vs--lose');
      } else {
        playerB.classList.add('vs--win');
        playerA.classList.add('vs--lose');
      }
    }, 2400);
  }

  // ── Smooth number tween: anime de la valeur actuelle vers la nouvelle ──
  const tweens = {};  // id => {raf, from, to, start}
  const TWEEN_MS = 500;
  function setNumSmooth(id, target) { _tween(id, target, 500); }
  function setNumSmoothSlow(id, target) {
    const n = document.getElementById(id);
    if (!n) return;
    // Premier appel: animer de 0 vers target en 1.8s (effet dramatique d'entree)
    const cur = Number(n.textContent.replace(/\D/g, '')) || 0;
    const dur = (cur === 0 && target > 0) ? 1800 : 500;
    _tween(id, target, dur);
  }
  function _tween(id, target, duration) {
    const n = document.getElementById(id);
    if (!n) return;
    target = Number(target) || 0;
    const current = Number(n.textContent.replace(/\D/g, '')) || 0;
    if (current === target) return;
    if (tweens[id]) cancelAnimationFrame(tweens[id].raf);
    const start = performance.now();
    const from  = current;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
      const val = Math.round(from + (target - from) * eased);
      n.textContent = val;
      if (t < 1) tweens[id] = { raf: requestAnimationFrame(step), from, to: target, start };
      else delete tweens[id];
    };
    tweens[id] = { raf: requestAnimationFrame(step), from, to: target, start };
  }
</script>
</body>
