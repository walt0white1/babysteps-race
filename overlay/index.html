<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Big+Shoulders+Display:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       BABY STEPS — Discreet corner chip
       Minimal, low-profile, doesn't fight the gameplay.
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:      #22d3ee;
      --a-glow: rgba(34, 211, 238, 0.5);
      --b:      #fbbf24;
      --b-glow: rgba(251, 191, 36, 0.5);
      --shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.7);
    }

    html, body {
      background: transparent;
      width: 100%; height: 100%;
      overflow: hidden;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      font-family: 'JetBrains Mono', monospace;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ========== CHIP ========== */
    .chip {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ========== ROW ========== */
    .row {
      --c:      var(--a);
      --c-glow: var(--a-glow);

      display: grid;
      grid-template-columns: 60px 50px 90px 26px;
      align-items: center;
      gap: 10px;
      height: 22px;
    }
    .row[data-p="b"] {
      --c:      var(--b);
      --c-glow: var(--b-glow);
    }

    /* Name — small mono uppercase */
    .name {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--c);
      text-shadow: var(--shadow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Altitude — big-ish but compact */
    .alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 1;
      color: #fff;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
      text-align: right;
    }
    .alt small {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.55);
      margin-left: 1px;
    }

    /* Bar — thin, discreet */
    .bar {
      height: 4px;
      background: rgba(0,0,0,0.4);
      border-radius: 2px;
      position: relative;
      overflow: visible;
      box-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .bar__fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      border-radius: 2px;
      background: var(--c);
      box-shadow: 0 0 6px var(--c-glow);
      transition: width 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bar__rec {
      position: absolute;
      top: -2px; bottom: -2px;
      width: 1.5px;
      background: rgba(255,255,255,0.7);
      box-shadow: 0 0 3px rgba(255,255,255,0.5);
      transition: left 0.5s ease;
      pointer-events: none;
    }

    /* Falls (compact) */
    .falls {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.5);
      text-shadow: var(--shadow);
      text-align: right;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes leadEnter {
      0%   { opacity: 0; transform: translateY(-6px); }
      18%  { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    .flash {
      position: fixed;
      top: 4px; left: 0; right: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      pointer-events: none;
      animation: leadEnter 2.6s ease forwards;
      z-index: 999;
      text-shadow: var(--shadow);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      30%      { transform: translateX(-2px); }
      60%      { transform: translateX(2px); }
    }
    .row.shaking { animation: shake 0.3s ease; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="chip">

  <!-- ── PLAYER A ── -->
  <div class="row" data-p="a" id="row-a">
    <div class="name" id="name-a">MATTEO</div>
    <div class="alt"><span id="num-a">0</span><small>M</small></div>
    <div class="bar">
      <div class="bar__fill" id="fill-a" style="width:0%"></div>
      <div class="bar__rec" id="rec-a" style="left:0%"></div>
    </div>
    <div class="falls" id="falls-a">0</div>
  </div>

  <!-- ── PLAYER B ── -->
  <div class="row" data-p="b" id="row-b">
    <div class="name" id="name-b">ABDOU</div>
    <div class="alt"><span id="num-b">0</span><small>M</small></div>
    <div class="bar">
      <div class="bar__fill" id="fill-b" style="width:0%"></div>
      <div class="bar__rec" id="rec-b" style="left:0%"></div>
    </div>
    <div class="falls" id="falls-b">0</div>
  </div>

</div>

<script>
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');
  const MAX_H       = 1200;

  if (SOLO_PLAYER === 'playerA') el('row-b').classList.add('hidden');
  else if (SOLO_PLAYER === 'playerB') el('row-a').classList.add('hidden');

  const socket = io(window.location.origin);
  socket.on('state_sync', applyState);
  socket.on('lead_change', ({ leader, state }) => { applyState(state); flashLead(leader, state); });
  socket.on('fall', ({ playerId }) => { shakeFall(playerId); });

  function applyState(s) {
    const a = s.playerA, b = s.playerB;

    setText('name-a', (a.name || 'Matteo').toUpperCase());
    setText('name-b', (b.name || 'Abdou').toUpperCase());
    setText('num-a',  Math.round(a.height));
    setText('num-b',  Math.round(b.height));
    setText('falls-a', '💀' + a.falls);
    setText('falls-b', '💀' + b.falls);

    const top   = Math.max(a.height, b.height, a.maxHeight, b.maxHeight, 1);
    const scale = Math.max(top * 1.05, MAX_H * 0.08);

    el('fill-a').style.width = pct(a.height,    scale) + '%';
    el('fill-b').style.width = pct(b.height,    scale) + '%';
    el('rec-a').style.left   = pct(a.maxHeight, scale) + '%';
    el('rec-b').style.left   = pct(b.maxHeight, scale) + '%';
  }

  function flashLead(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    if (leader === 'tie') return;
    const name  = leader === 'playerA' ? (state.playerA.name || 'Matteo') : (state.playerB.name || 'Abdou');
    const color = leader === 'playerA' ? '#22d3ee' : '#fbbf24';
    const glow  = leader === 'playerA' ? 'rgba(34,211,238,0.5)' : 'rgba(251,191,36,0.5)';
    const d = document.createElement('div');
    d.className = 'flash';
    d.style.color = color;
    d.style.textShadow = '0 0 14px ' + glow + ', 0 2px 8px rgba(0,0,0,0.95)';
    d.textContent = '↑ ' + name.toUpperCase() + ' LEADS';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2700);
  }

  function shakeFall(playerId) {
    const id = playerId === 'playerA' ? 'row-a' : 'row-b';
    const n = el(id);
    if (!n) return;
    n.classList.add('shaking');
    setTimeout(() => n.classList.remove('shaking'), 320);
  }

  function pct(v, m)      { return Math.min(100, Math.max(0, (v / m) * 100)).toFixed(2); }
  function el(id)         { return document.getElementById(id); }
  function setText(id, t) { const n = el(id); if (n) n.textContent = t; }
</script>
</body>
</html>
