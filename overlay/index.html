<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@200..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       BABY STEPS — minimal floating altimeter
       No card. Just the gauge + text floating, with text-shadows for legibility.
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:      #67e8f9;
      --a-deep: #155e75;
      --a-glow: rgba(103, 232, 249, 0.55);

      --b:      #fbbf24;
      --b-deep: #78350f;
      --b-glow: rgba(251, 191, 36, 0.55);

      --shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.7);
    }

    html, body {
      background: transparent;
      width: 100%; height: 100%;
      overflow: hidden;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      gap: 36px;
      min-height: 100vh;
    }

    /* ========== ONE PLAYER ========== */
    .player {
      --c:      var(--a);
      --c-deep: var(--a-deep);
      --c-glow: var(--a-glow);

      display: flex;
      gap: 14px;
      align-items: stretch;
      height: 440px;
    }
    .player[data-p="b"] {
      --c:      var(--b);
      --c-deep: var(--b-deep);
      --c-glow: var(--b-glow);
    }

    /* ===== Gauge ===== */
    .gauge {
      width: 38px;
      height: 100%;
      position: relative;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0.4));
      border-radius: 19px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        inset 0 -1px 0 rgba(0,0,0,0.4),
        inset 0 0 0 1px rgba(255,255,255,0.06),
        0 4px 16px rgba(0,0,0,0.5),
        0 2px 4px rgba(0,0,0,0.4);
      overflow: visible;
    }

    .gauge__track {
      position: absolute;
      inset: 0;
      border-radius: 19px;
      overflow: hidden;
    }

    /* Subtle inner shadow at top of track (depth) */
    .gauge__track::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 30% at 50% 0%, rgba(0,0,0,0.4) 0%, transparent 60%);
      pointer-events: none;
      z-index: 4;
    }

    .gauge__fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 0%;
      border-radius: 19px;
      background:
        linear-gradient(180deg,
          color-mix(in srgb, var(--c) 110%, white 10%) 0%,
          var(--c) 8%,
          color-mix(in srgb, var(--c) 80%, var(--c-deep)) 35%,
          color-mix(in srgb, var(--c) 50%, var(--c-deep)) 65%,
          var(--c-deep) 100%);
      transition: height 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.4),
        inset 1px 0 0 rgba(255,255,255,0.15),
        inset -1px 0 0 rgba(0,0,0,0.2);
    }

    /* Vertical glass highlight on the fill */
    .gauge__fill > .shine {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: 6px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.35) 0%,
        rgba(255,255,255,0.05) 100%);
      border-radius: 3px;
      pointer-events: none;
    }

    /* Meniscus glow - large diffuse halo */
    .gauge__fill::before {
      content: '';
      position: absolute;
      top: -16px; left: -120%; right: -120%;
      height: 32px;
      background: radial-gradient(ellipse at center,
        color-mix(in srgb, var(--c) 110%, white 10%) 0%,
        var(--c) 15%,
        var(--c-glow) 45%,
        transparent 75%);
      filter: blur(5px);
      animation: pulse 2.8s ease-in-out infinite;
      pointer-events: none;
      z-index: 5;
    }
    /* Bright crisp meniscus line */
    .gauge__fill::after {
      content: '';
      position: absolute;
      top: -1.5px; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.9) 0%,
        var(--c) 100%);
      border-radius: 2px;
      box-shadow:
        0 0 8px var(--c),
        0 0 16px var(--c-glow),
        0 0 24px var(--c-glow);
      z-index: 6;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }

    /* Record marker - hairline + chevron */
    .gauge__rec {
      position: absolute;
      left: -5px; right: -5px;
      height: 1.5px;
      background: rgba(255,255,255,0.85);
      box-shadow:
        0 0 6px rgba(255,255,255,0.7),
        0 0 12px rgba(255,255,255,0.35);
      transition: bottom 0.55s ease;
      z-index: 3;
      pointer-events: none;
    }
    .gauge__rec::before {
      content: '';
      position: absolute;
      left: -6px; top: -3.5px;
      width: 0; height: 0;
      border-top: 4.5px solid transparent;
      border-bottom: 4.5px solid transparent;
      border-left: 6px solid #fff;
      filter: drop-shadow(0 0 3px rgba(255,255,255,0.6));
    }

    /* ===== Text column ===== */
    .info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      min-width: 140px;
      padding: 4px 0;
    }

    .info__top {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* NAME — strong editorial italic */
    .info__name {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 600;
      font-size: 26px;
      letter-spacing: -0.005em;
      color: var(--c);
      text-shadow:
        0 1px 2px rgba(0,0,0,0.95),
        0 0 12px rgba(0,0,0,0.7),
        0 0 24px color-mix(in srgb, var(--c) 30%, transparent);
      font-variation-settings: "opsz" 144;
      white-space: nowrap;
      line-height: 1;
    }

    /* ALTITUDE — the hero number, dominant */
    .info__num {
      font-family: 'Antonio', sans-serif;
      font-weight: 400;
      font-size: 104px;
      line-height: 0.8;
      color: #fff;
      letter-spacing: -0.035em;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 2px 4px rgba(0,0,0,0.95),
        0 0 18px rgba(0,0,0,0.8),
        0 0 32px color-mix(in srgb, var(--c) 22%, transparent);
      margin-top: 6px;
    }
    .info__num--small { font-size: 80px; }

    /* METRES label — tracked, present */
    .info__unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.42em;
      color: rgba(255,255,255,0.65);
      text-shadow: var(--shadow);
      margin-top: 6px;
      padding-left: 2px;
    }

    /* PEAK + FALLS — secondary, but readable */
    .info__bot {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .info__peak {
      color: rgba(255,255,255,0.55);
      text-shadow: var(--shadow);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .info__peak strong {
      font-family: 'Antonio', sans-serif;
      font-weight: 500;
      font-size: 22px;
      color: var(--c);
      letter-spacing: -0.02em;
      text-shadow:
        var(--shadow),
        0 0 12px color-mix(in srgb, var(--c) 40%, transparent);
    }
    .info__falls {
      color: rgba(255,255,255,0.4);
      text-shadow: var(--shadow);
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .info__falls strong {
      font-family: 'Antonio', sans-serif;
      font-weight: 500;
      font-size: 20px;
      color: rgba(255,255,255,0.85);
      letter-spacing: -0.02em;
    }

    /* ===== Animations ===== */
    @keyframes leadEnter {
      0%   { opacity: 0; transform: translateY(-8px); }
      18%  { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    .lead-flash {
      position: fixed;
      top: 4px; left: 0; right: 0;
      text-align: center;
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      pointer-events: none;
      animation: leadEnter 3s ease forwards;
      z-index: 999;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-2px); }
      40%      { transform: translateX(2px); }
      60%      { transform: translateX(-1px); }
      80%      { transform: translateX(1px); }
    }
    .player.shaking { animation: shake 0.4s ease; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── PLAYER A ── -->
  <div class="player" data-p="a" id="p-a">
    <div class="gauge">
      <div class="gauge__track">
        <div class="gauge__fill" id="fill-a" style="height:0%"><div class="shine"></div></div>
      </div>
      <div class="gauge__rec" id="rec-a" style="bottom:0%"></div>
    </div>
    <div class="info">
      <div class="info__top">
        <div class="info__name" id="name-a">Matteo</div>
        <div class="info__num" id="num-a">0</div>
        <div class="info__unit">METRES</div>
      </div>
      <div class="info__bot">
        <div class="info__peak"><strong id="peak-a">0</strong>peak</div>
        <div class="info__falls"><strong id="falls-a">00</strong>falls</div>
      </div>
    </div>
  </div>

  <!-- ── PLAYER B ── -->
  <div class="player" data-p="b" id="p-b">
    <div class="gauge">
      <div class="gauge__track">
        <div class="gauge__fill" id="fill-b" style="height:0%"><div class="shine"></div></div>
      </div>
      <div class="gauge__rec" id="rec-b" style="bottom:0%"></div>
    </div>
    <div class="info">
      <div class="info__top">
        <div class="info__name" id="name-b">Abdou</div>
        <div class="info__num" id="num-b">0</div>
        <div class="info__unit">METRES</div>
      </div>
      <div class="info__bot">
        <div class="info__peak"><strong id="peak-b">0</strong>peak</div>
        <div class="info__falls"><strong id="falls-b">00</strong>falls</div>
      </div>
    </div>
  </div>

<script>
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');
  const MAX_H       = 1200;

  if (SOLO_PLAYER === 'playerA') el('p-b').classList.add('hidden');
  else if (SOLO_PLAYER === 'playerB') el('p-a').classList.add('hidden');

  const socket = io(window.location.origin);
  socket.on('state_sync', applyState);
  socket.on('lead_change', ({ leader, state }) => { applyState(state); flashLead(leader, state); });
  socket.on('fall', ({ playerId }) => { shakeFall(playerId); });

  function applyState(s) {
    const a = s.playerA, b = s.playerB;

    setText('name-a', a.name || 'Matteo');
    setText('name-b', b.name || 'Abdou');

    setNum('num-a', a.height);
    setNum('num-b', b.height);
    setText('peak-a', Math.round(a.maxHeight));
    setText('peak-b', Math.round(b.maxHeight));
    setText('falls-a', String(a.falls).padStart(2, '0'));
    setText('falls-b', String(b.falls).padStart(2, '0'));

    const top   = Math.max(a.height, b.height, a.maxHeight, b.maxHeight, 1);
    const scale = Math.max(top * 1.05, MAX_H * 0.08);

    el('fill-a').style.height = pct(a.height,    scale) + '%';
    el('fill-b').style.height = pct(b.height,    scale) + '%';
    el('rec-a').style.bottom  = pct(a.maxHeight, scale) + '%';
    el('rec-b').style.bottom  = pct(b.maxHeight, scale) + '%';
  }

  function flashLead(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    if (leader === 'tie') return;
    const name  = leader === 'playerA' ? (state.playerA.name || 'Matteo') : (state.playerB.name || 'Abdou');
    const color = leader === 'playerA' ? '#67e8f9' : '#fbbf24';
    const glow  = leader === 'playerA' ? 'rgba(103,232,249,0.55)' : 'rgba(251,191,36,0.55)';
    const d = document.createElement('div');
    d.className = 'lead-flash';
    d.style.color = color;
    d.style.textShadow = '0 0 18px ' + glow + ', 0 2px 10px rgba(0,0,0,0.95)';
    d.textContent = '↑  ' + name + ' takes the lead';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3100);
  }

  function shakeFall(playerId) {
    const id = playerId === 'playerA' ? 'p-a' : 'p-b';
    const n = el(id);
    if (!n) return;
    n.classList.add('shaking');
    setTimeout(() => n.classList.remove('shaking'), 420);
  }

  function pct(v, m)      { return Math.min(100, Math.max(0, (v / m) * 100)).toFixed(2); }
  function el(id)         { return document.getElementById(id); }
  function setText(id, t) { const n = el(id); if (n) n.textContent = t; }
  function setNum(id, v) {
    const n = el(id); if (!n) return;
    const r = Math.round(v);
    n.textContent = r;
    n.classList.toggle('info__num--small', String(r).length >= 4);
  }
</script>
</body>
</html>
