<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Race Telemetry</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@300;500;700;900&family=Syne:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       BABY STEPS — RACE TELEMETRY
       Esports / F1-style horizontal leaderboard, transparent for OBS.
       Big Shoulders Display (big numbers) · Syne (names) · JetBrains Mono (data).
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:        #22d3ee;
      --a-deep:   #0e7490;
      --a-glow:   rgba(34, 211, 238, 0.55);

      --b:        #f472b6;
      --b-deep:   #9d174d;
      --b-glow:   rgba(244, 114, 182, 0.55);

      --ink:      #06080c;
      --frame:    rgba(255,255,255,0.08);
      --text:     #f1f5f9;
      --dim:      #64748b;
      --faint:    #334155;
    }

    html, body {
      background: transparent;
      width: 100%; height: 100%;
      overflow: hidden;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Syne', sans-serif;
    }

    /* ========== BOARD ========== */
    .board {
      width: 620px;
      background:
        linear-gradient(180deg, rgba(8,11,17,0.92), rgba(4,6,10,0.92));
      border: 1px solid var(--frame);
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 18px 50px -16px rgba(0,0,0,0.75),
        inset 0 1px 0 rgba(255,255,255,0.05);
      position: relative;
      overflow: hidden;
    }

    /* Subtle racing stripe accent across the top */
    .board::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--a) 20%,
        var(--a) 35%,
        transparent 50%,
        var(--b) 65%,
        var(--b) 80%,
        transparent 100%);
      opacity: 0.6;
    }

    /* Board header */
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--frame);
    }
    .head__title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.35em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .head__title strong {
      color: var(--text);
      font-weight: 700;
    }
    .head__live {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #ef4444;
      text-transform: uppercase;
    }
    .head__live::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px #ef4444;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* ========== ROW per player ========== */
    .row {
      --c:      var(--a);
      --c-deep: var(--a-deep);
      --c-glow: var(--a-glow);

      display: grid;
      grid-template-columns: 22px 28px 1fr 92px;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      position: relative;
    }
    .row[data-p="b"] {
      --c:      var(--b);
      --c-deep: var(--b-deep);
      --c-glow: var(--b-glow);
    }
    .row + .row {
      border-top: 1px solid var(--frame);
    }

    /* Position badge */
    .pos {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 26px;
      color: var(--c);
      line-height: 1;
      text-shadow: 0 0 14px var(--c-glow);
      text-align: center;
      letter-spacing: -0.03em;
      transition: color 0.4s, text-shadow 0.4s;
    }
    .row.behind .pos {
      color: var(--dim);
      text-shadow: none;
    }

    /* Color dot indicator */
    .dot {
      width: 12px; height: 12px;
      border-radius: 3px;
      background: var(--c);
      box-shadow:
        0 0 8px var(--c-glow),
        inset 0 1px 0 rgba(255,255,255,0.35);
      transform: rotate(45deg);
      justify-self: center;
    }

    /* Player block - name + altitude + bar */
    .player {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .player__top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .player__name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.04em;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 28px;
      line-height: 1;
      color: var(--c);
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 16px var(--c-glow);
      flex-shrink: 0;
    }
    .player__alt small {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--dim);
      margin-left: 3px;
      text-shadow: none;
    }

    /* Horizontal bar */
    .bar {
      height: 8px;
      background: rgba(255,255,255,0.045);
      border-radius: 4px;
      position: relative;
      overflow: visible;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .bar__fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      border-radius: 4px;
      background: linear-gradient(90deg,
        var(--c-deep) 0%,
        var(--c) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        0 0 12px var(--c-glow);
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Bright leading edge */
    .bar__fill::after {
      content: '';
      position: absolute;
      top: -1px; bottom: -1px;
      right: -1px;
      width: 2px;
      background: #fff;
      border-radius: 1px;
      box-shadow: 0 0 8px var(--c), 0 0 16px var(--c-glow);
    }
    /* Record marker */
    .bar__rec {
      position: absolute;
      top: -3px; bottom: -3px;
      width: 1.5px;
      background: rgba(255,255,255,0.7);
      border-radius: 1px;
      box-shadow: 0 0 4px rgba(255,255,255,0.5);
      transition: left 0.55s ease;
      z-index: 2;
    }
    .bar__rec::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      width: 0; height: 0;
      border-left: 3.5px solid transparent;
      border-right: 3.5px solid transparent;
      border-bottom: 4px solid rgba(255,255,255,0.85);
    }

    /* Right column - delta + falls */
    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .meta__delta {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 700;
      font-size: 22px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: var(--c);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px var(--c-glow);
      transition: color 0.4s, text-shadow 0.4s;
    }
    .row.behind .meta__delta {
      color: #ef4444;
      text-shadow: 0 0 12px rgba(239,68,68,0.5);
    }
    .row.tied .meta__delta {
      color: var(--dim);
      text-shadow: none;
    }
    .meta__sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--dim);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .meta__sub strong {
      color: var(--text);
      font-weight: 700;
      margin-right: 3px;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes leadEnter {
      0%   { opacity: 0; transform: translateY(-8px); }
      18%  { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    .flash {
      position: fixed;
      top: 12px; left: 0; right: 0;
      text-align: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      pointer-events: none;
      animation: leadEnter 3s ease forwards;
      z-index: 999;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-3px); }
      40%      { transform: translateX(3px); }
      60%      { transform: translateX(-2px); }
      80%      { transform: translateX(2px); }
    }
    .row.shaking { animation: shake 0.4s ease; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="board">

  <div class="head">
    <div class="head__title">BABY&nbsp;STEPS <strong>// LIVE&nbsp;TELEMETRY</strong></div>
    <div class="head__live">REC</div>
  </div>

  <!-- ── PLAYER A ── -->
  <div class="row" data-p="a" id="row-a">
    <div class="pos" id="pos-a">P1</div>
    <div class="dot"></div>
    <div class="player">
      <div class="player__top">
        <div class="player__name" id="name-a">Matteo</div>
        <div class="player__alt"><span id="num-a">0</span><small>M</small></div>
      </div>
      <div class="bar">
        <div class="bar__fill" id="fill-a" style="width:0%"></div>
        <div class="bar__rec" id="rec-a" style="left:0%"></div>
      </div>
    </div>
    <div class="meta">
      <div class="meta__delta" id="delta-a">—</div>
      <div class="meta__sub"><strong id="peak-a">0</strong>peak · <strong id="falls-a">0</strong>fall</div>
    </div>
  </div>

  <!-- ── PLAYER B ── -->
  <div class="row" data-p="b" id="row-b">
    <div class="pos" id="pos-b">P2</div>
    <div class="dot"></div>
    <div class="player">
      <div class="player__top">
        <div class="player__name" id="name-b">Abdou</div>
        <div class="player__alt"><span id="num-b">0</span><small>M</small></div>
      </div>
      <div class="bar">
        <div class="bar__fill" id="fill-b" style="width:0%"></div>
        <div class="bar__rec" id="rec-b" style="left:0%"></div>
      </div>
    </div>
    <div class="meta">
      <div class="meta__delta" id="delta-b">—</div>
      <div class="meta__sub"><strong id="peak-b">0</strong>peak · <strong id="falls-b">0</strong>fall</div>
    </div>
  </div>

</div>

<script>
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');
  const MAX_H       = 1200;

  if (SOLO_PLAYER === 'playerA') el('row-b').classList.add('hidden');
  else if (SOLO_PLAYER === 'playerB') el('row-a').classList.add('hidden');

  const socket = io(window.location.origin);
  socket.on('state_sync', applyState);
  socket.on('lead_change', ({ leader, state }) => { applyState(state); flashLead(leader, state); });
  socket.on('fall', ({ playerId }) => { shakeFall(playerId); });

  function applyState(s) {
    const a = s.playerA, b = s.playerB;

    setText('name-a', (a.name || 'Matteo').toUpperCase());
    setText('name-b', (b.name || 'Abdou').toUpperCase());

    setText('num-a', Math.round(a.height));
    setText('num-b', Math.round(b.height));
    setText('peak-a', Math.round(a.maxHeight));
    setText('peak-b', Math.round(b.maxHeight));
    setText('falls-a', a.falls);
    setText('falls-b', b.falls);

    const top   = Math.max(a.height, b.height, a.maxHeight, b.maxHeight, 1);
    const scale = Math.max(top * 1.05, MAX_H * 0.08);

    el('fill-a').style.width = pct(a.height,    scale) + '%';
    el('fill-b').style.width = pct(b.height,    scale) + '%';
    el('rec-a').style.left   = pct(a.maxHeight, scale) + '%';
    el('rec-b').style.left   = pct(b.maxHeight, scale) + '%';

    // Position + delta logic
    const rowA = el('row-a'), rowB = el('row-b');
    const posA = el('pos-a'), posB = el('pos-b');
    const dlA  = el('delta-a'), dlB = el('delta-b');

    if (a.height === b.height) {
      posA.textContent = 'P1'; posB.textContent = 'P1';
      dlA.textContent = '0';   dlB.textContent = '0';
      rowA.classList.remove('behind'); rowA.classList.add('tied');
      rowB.classList.remove('behind'); rowB.classList.add('tied');
    } else if (a.height > b.height) {
      posA.textContent = 'P1'; posB.textContent = 'P2';
      dlA.textContent = 'LEAD';
      dlB.textContent = '-' + Math.round(a.height - b.height);
      rowA.classList.remove('behind', 'tied');
      rowB.classList.add('behind');    rowB.classList.remove('tied');
    } else {
      posA.textContent = 'P2'; posB.textContent = 'P1';
      dlA.textContent = '-' + Math.round(b.height - a.height);
      dlB.textContent = 'LEAD';
      rowA.classList.add('behind');    rowA.classList.remove('tied');
      rowB.classList.remove('behind', 'tied');
    }
  }

  function flashLead(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    if (leader === 'tie') return;
    const name  = leader === 'playerA' ? (state.playerA.name || 'Matteo') : (state.playerB.name || 'Abdou');
    const color = leader === 'playerA' ? '#22d3ee' : '#f472b6';
    const glow  = leader === 'playerA' ? 'rgba(34,211,238,0.55)' : 'rgba(244,114,182,0.55)';
    const d = document.createElement('div');
    d.className = 'flash';
    d.style.color = color;
    d.style.textShadow = '0 0 18px ' + glow + ', 0 2px 10px rgba(0,0,0,0.95)';
    d.textContent = '◆  ' + name.toUpperCase() + ' TAKES P1';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3100);
  }

  function shakeFall(playerId) {
    const id = playerId === 'playerA' ? 'row-a' : 'row-b';
    const n = el(id);
    if (!n) return;
    n.classList.add('shaking');
    setTimeout(() => n.classList.remove('shaking'), 420);
  }

  function pct(v, m)      { return Math.min(100, Math.max(0, (v / m) * 100)).toFixed(2); }
  function el(id)         { return document.getElementById(id); }
  function setText(id, t) { const n = el(id); if (n) n.textContent = t; }
</script>
</body>
</html>
