<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'Inter', sans-serif;
      width: 480px;
      padding: 12px 14px;
      overflow: hidden;
    }

    /* ── Wrapper global ────────────────────────────────────────────────── */
    .overlay {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Chaque joueur ──────────────────────────────────────────────────── */
    .player-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Ligne nom + hauteur */
    .player-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .player-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.12em;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .player-height {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 8px rgba(0,0,0,0.9), 0 0 24px rgba(0,0,0,0.7);
      line-height: 1;
    }
    .player-height span {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      opacity: 0.7;
      margin-left: 1px;
    }

    /* Sous-info : record + chutes */
    .player-sub {
      font-size: 0.67rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      opacity: 0.75;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      text-transform: uppercase;
    }

    /* ── Barre de progression ───────────────────────────────────────────── */
    .bar-wrap {
      height: 10px;
      background: rgba(0,0,0,0.28);
      border-radius: 5px;
      position: relative;
      overflow: visible;
    }

    .bar-fill {
      height: 100%;
      border-radius: 5px;
      min-width: 0;
      transition: width 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    /* Reflet brillant sur la barre */
    .bar-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: rgba(255,255,255,0.22);
      border-radius: 5px 5px 0 0;
      pointer-events: none;
    }

    /* Player A — glacier */
    .bar-a {
      background: linear-gradient(90deg, #1e4f9a 0%, #3b82f6 60%, #93c5fd 100%);
      box-shadow: 0 0 10px rgba(59,130,246,0.6), 0 2px 8px rgba(0,0,0,0.5);
    }
    /* Player B — volcan */
    .bar-b {
      background: linear-gradient(90deg, #92400e 0%, #f97316 60%, #fcd34d 100%);
      box-shadow: 0 0 10px rgba(249,115,22,0.6), 0 2px 8px rgba(0,0,0,0.5);
    }

    /* Marqueur record */
    .bar-record {
      position: absolute;
      top: -3px; bottom: -3px;
      width: 2px;
      background: rgba(255,255,255,0.9);
      border-radius: 1px;
      box-shadow: 0 0 6px rgba(255,255,255,0.8);
      transition: left 0.4s ease;
      pointer-events: none;
    }

    /* ── Séparateur entre les deux joueurs ─────────────────────────────── */
    .diff-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 2px;
    }
    .diff-line {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.15);
    }
    .diff-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      color: rgba(255,255,255,0.6);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
      transition: color 0.3s;
    }
    .diff-text.lead-a { color: #93c5fd; }
    .diff-text.lead-b { color: #fcd34d; }

    /* ── Dots ───────────────────────────────────────────────────────────── */
    .dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      vertical-align: middle;
      margin-bottom: 1px;
    }
    .dot.on  { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
    .dot.off { background: #ef4444; }

    /* ── Animations ─────────────────────────────────────────────────────── */
    @keyframes leadFlash {
      0%   { opacity:0; transform:scale(0.8) translateY(-6px); }
      15%  { opacity:1; transform:scale(1.06) translateY(0); }
      75%  { opacity:1; }
      100% { opacity:0; transform:translateY(-10px); }
    }
    .lead-change-anim {
      position: fixed;
      top: 0; left: 0; right: 0;
      text-align: center;
      padding: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.2em;
      animation: leadFlash 3s ease forwards;
      pointer-events: none;
      z-index: 999;
    }

    @keyframes fallBounce {
      0%   { opacity:0; transform:translateY(-20px) scale(1.2); }
      20%  { opacity:1; transform:translateY(0) scale(1); }
      70%  { opacity:1; }
      100% { opacity:0; }
    }
    .fall-anim {
      position: fixed;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.1em;
      animation: fallBounce 2.2s ease forwards;
      pointer-events: none;
      z-index: 998;
      text-shadow: 0 2px 12px rgba(0,0,0,1);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="overlay" id="overlay">

  <!-- Player A -->
  <div class="player-block" id="row-a">
    <div class="player-top">
      <div class="player-name" id="name-a" style="color:#93c5fd">
        Player A
        <span class="dot off" id="dot-a"></span>
      </div>
      <div class="player-height" id="height-a" style="color:#93c5fd">0<span>m</span></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-fill bar-a" id="bar-a" style="width:0%"></div>
      <div class="bar-record" id="record-a" style="left:0%"></div>
    </div>
    <div class="player-sub" id="sub-a" style="color:#93c5fd">Record 0m &nbsp;·&nbsp; 💀 0 chute</div>
  </div>

  <!-- Séparateur diff (mode double) -->
  <div class="diff-strip" id="diff-row">
    <div class="diff-line"></div>
    <div class="diff-text" id="diff-text">ECART : 0M</div>
    <div class="diff-line"></div>
  </div>

  <!-- Player B -->
  <div class="player-block" id="row-b">
    <div class="player-top">
      <div class="player-name" id="name-b" style="color:#fcd34d">
        Player B
        <span class="dot off" id="dot-b"></span>
      </div>
      <div class="player-height" id="height-b" style="color:#fcd34d">0<span>m</span></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-fill bar-b" id="bar-b" style="width:0%"></div>
      <div class="bar-record" id="record-b" style="left:0%"></div>
    </div>
    <div class="player-sub" id="sub-b" style="color:#fcd34d">Record 0m &nbsp;·&nbsp; 💀 0 chute</div>
  </div>

</div>

<script>
  const SERVER      = window.location.origin;
  const MAX_H       = 1200;
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');

  if (SOLO_PLAYER === 'playerA') {
    el('row-b').classList.add('hidden');
    el('diff-row').classList.add('hidden');
  } else if (SOLO_PLAYER === 'playerB') {
    el('row-a').classList.add('hidden');
    el('diff-row').classList.add('hidden');
  }

  const socket = io(SERVER);
  socket.on('state_sync', applyState);
  socket.on('lead_change', ({ leader, state }) => { applyState(state); flashLeadChange(leader, state); });
  socket.on('fall', ({ playerId }) => {
    if (!SOLO_PLAYER || SOLO_PLAYER === playerId) spawnFallAnim(playerId);
  });

  function applyState(s) {
    const a = s.playerA, b = s.playerB;

    // Noms
    el('name-a').childNodes[0].textContent = a.name + ' ';
    el('name-b').childNodes[0].textContent = b.name + ' ';
    el('dot-a').className = 'dot ' + (a.online ? 'on' : 'off');
    el('dot-b').className = 'dot ' + (b.online ? 'on' : 'off');

    // Hauteurs
    el('height-a').innerHTML = Math.round(a.height) + '<span>m</span>';
    el('height-b').innerHTML = Math.round(b.height) + '<span>m</span>';

    // Sous-ligne
    el('sub-a').textContent = 'Record ' + Math.round(a.maxHeight) + 'm  ·  💀 ' + a.falls + (a.falls > 1 ? ' chutes' : ' chute');
    el('sub-b').textContent = 'Record ' + Math.round(b.maxHeight) + 'm  ·  💀 ' + b.falls + (b.falls > 1 ? ' chutes' : ' chute');

    // Barres
    const top  = Math.max(a.height, b.height, a.maxHeight, b.maxHeight, 1);
    const base = Math.max(top, MAX_H * 0.1);
    el('bar-a').style.width   = pct(a.height,    base) + '%';
    el('bar-b').style.width   = pct(b.height,    base) + '%';
    el('record-a').style.left = pct(a.maxHeight, base) + '%';
    el('record-b').style.left = pct(b.maxHeight, base) + '%';

    // Diff
    const diff   = Math.abs(a.height - b.height);
    const leader = a.height > b.height ? 'a' : b.height > a.height ? 'b' : 'tie';
    const diffEl = el('diff-text');

    if (leader === 'tie') {
      diffEl.className   = 'diff-text';
      diffEl.textContent = 'EGALITE';
    } else {
      const name = leader === 'a' ? a.name : b.name;
      diffEl.className   = 'diff-text lead-' + leader;
      diffEl.textContent = '+' + Math.round(diff) + 'M  ' + name.toUpperCase();
    }
  }

  function flashLeadChange(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    const name  = leader === 'playerA' ? state.playerA.name : state.playerB.name;
    const color = leader === 'playerA' ? '#93c5fd' : '#fcd34d';
    const d = document.createElement('div');
    d.className = 'lead-change-anim';
    d.style.color      = color;
    d.style.textShadow = '0 0 20px ' + color + ', 0 2px 10px rgba(0,0,0,0.9)';
    d.textContent = '⛰️ ' + name.toUpperCase() + ' PREND LA TETE !';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3200);
  }

  function spawnFallAnim(playerId) {
    const isA = playerId === 'playerA';
    const d   = document.createElement('div');
    d.className   = 'fall-anim';
    d.style.color = isA ? '#93c5fd' : '#fcd34d';
    d.style.top   = SOLO_PLAYER ? '50px' : (isA ? '60px' : '140px');
    d.style.left  = (40 + Math.random() * 100) + 'px';
    d.textContent = '💀 CHUTE !';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2300);
  }

  function pct(v, m) { return Math.min(100, Math.max(0, (v / m) * 100)).toFixed(2); }
  function el(id)     { return document.getElementById(id); }
</script>
</body>
</html>
