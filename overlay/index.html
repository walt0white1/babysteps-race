<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       BABY STEPS — Avatar + meters
       Twitch avatar circle + big altitude number. Minimal.
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:      #22d3ee;
      --a-glow: rgba(34, 211, 238, 0.6);
      --b:      #fbbf24;
      --b-glow: rgba(251, 191, 36, 0.6);
      --shadow: 0 2px 4px rgba(0,0,0,0.95), 0 0 10px rgba(0,0,0,0.7);
    }

    html, body {
      background: transparent;
      width: 100%; height: 100%;
      overflow: hidden;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
      gap: 30px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ========== ONE PLAYER ========== */
    .player {
      --c:      var(--a);
      --c-glow: var(--a-glow);

      display: flex;
      align-items: center;
      gap: 14px;
    }
    .player[data-p="b"] {
      --c:      var(--b);
      --c-glow: var(--b-glow);
    }

    /* ===== Avatar ===== */
    .avatar {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
      background: rgba(0,0,0,0.4);
      box-shadow:
        0 0 18px var(--c-glow),
        0 4px 14px rgba(0,0,0,0.7),
        0 1px 3px rgba(0,0,0,0.5);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    /* Loading placeholder = initial */
    .avatar__initial {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 30px;
      color: var(--c);
      text-shadow: 0 0 8px var(--c-glow);
      pointer-events: none;
    }
    .avatar.loaded .avatar__initial { display: none; }

    /* ===== Info ===== */
    .info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .info__alt {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 48px;
      line-height: 0.85;
      color: #fff;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
    }
    .info__alt small {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--c);
      margin-left: 3px;
      text-shadow: var(--shadow), 0 0 10px var(--c-glow);
      line-height: 0.85;
    }
    .info__name {
      font-family: 'Big Shoulders Display', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.92);
      text-shadow: var(--shadow);
      line-height: 1;
      margin-top: 4px;
      text-transform: lowercase;
    }

    /* ===== Animations ===== */
    @keyframes leadEnter {
      0%   { opacity: 0; transform: translateY(-6px); }
      18%  { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-3px); }
    }
    .flash {
      position: fixed;
      top: 4px; left: 0; right: 0;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      pointer-events: none;
      animation: leadEnter 2.6s ease forwards;
      z-index: 999;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      30%      { transform: translateX(-3px); }
      60%      { transform: translateX(3px); }
    }
    .player.shaking { animation: shake 0.3s ease; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── PLAYER A ── -->
  <div class="player" data-p="a" id="p-a">
    <div class="avatar" id="av-a">
      <div class="avatar__initial" id="init-a">M</div>
      <img id="img-a" alt="" onload="this.parentElement.classList.add('loaded')" onerror="this.style.display='none'">
    </div>
    <div class="info">
      <div class="info__alt"><span id="num-a">0</span><small>m</small></div>
      <div class="info__name" id="name-a">el_matte0</div>
    </div>
  </div>

  <!-- ── PLAYER B ── -->
  <div class="player" data-p="b" id="p-b">
    <div class="avatar" id="av-b">
      <div class="avatar__initial" id="init-b">T</div>
      <img id="img-b" alt="" onload="this.parentElement.classList.add('loaded')" onerror="this.style.display='none'">
    </div>
    <div class="info">
      <div class="info__alt"><span id="num-b">0</span><small>m</small></div>
      <div class="info__name" id="name-b">tvabdou</div>
    </div>
  </div>

<script>
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');

  if (SOLO_PLAYER === 'playerA') el('p-b').classList.add('hidden');
  else if (SOLO_PLAYER === 'playerB') el('p-a').classList.add('hidden');

  // ── Fetch Twitch avatars via decapi (public, no auth) ──
  const TWITCH_A = params.get('twitchA') || 'el_matte0';
  const TWITCH_B = params.get('twitchB') || 'tvabdou';
  loadTwitchAvatar(TWITCH_A, 'img-a');
  loadTwitchAvatar(TWITCH_B, 'img-b');

  // Display Twitch usernames as the player names
  setText('name-a', TWITCH_A);
  setText('name-b', TWITCH_B);
  setText('init-a', TWITCH_A.charAt(0).toUpperCase());
  setText('init-b', TWITCH_B.charAt(0).toUpperCase());

  function loadTwitchAvatar(username, imgId) {
    fetch('https://decapi.me/twitch/avatar/' + encodeURIComponent(username))
      .then(r => r.text())
      .then(url => {
        if (url && url.startsWith('http')) {
          document.getElementById(imgId).src = url;
        }
      })
      .catch(() => {});
  }

  const socket = io(window.location.origin);
  socket.on('state_sync', applyState);
  socket.on('lead_change', ({ leader, state }) => { applyState(state); flashLead(leader, state); });
  socket.on('fall', ({ playerId }) => { shakeFall(playerId); });

  function applyState(s) {
    const a = s.playerA, b = s.playerB;
    setText('num-a', Math.round(a.height));
    setText('num-b', Math.round(b.height));
  }

  function flashLead(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    if (leader === 'tie') return;
    const name  = leader === 'playerA' ? (state.playerA.name || 'Matteo') : (state.playerB.name || 'Abdou');
    const color = leader === 'playerA' ? '#22d3ee' : '#fbbf24';
    const glow  = leader === 'playerA' ? 'rgba(34,211,238,0.6)' : 'rgba(251,191,36,0.6)';
    const d = document.createElement('div');
    d.className = 'flash';
    d.style.color = color;
    d.style.textShadow = '0 0 14px ' + glow + ', 0 2px 8px rgba(0,0,0,0.95)';
    d.textContent = '↑ ' + name.toUpperCase() + ' LEADS';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2700);
  }

  function shakeFall(playerId) {
    const id = playerId === 'playerA' ? 'p-a' : 'p-b';
    const n = el(id);
    if (!n) return;
    n.classList.add('shaking');
    setTimeout(() => n.classList.remove('shaking'), 320);
  }

  function el(id)         { return document.getElementById(id); }
  function setText(id, t) { const n = el(id); if (n) n.textContent = t; }
</script>
</body>
</html>
