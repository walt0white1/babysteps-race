<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Baby Steps — Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@200..700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       BABY STEPS — minimal floating altimeter
       No card. Just the gauge + text floating, with text-shadows for legibility.
       ========================================================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --a:      #67e8f9;
      --a-deep: #155e75;
      --a-glow: rgba(103, 232, 249, 0.55);

      --b:      #fbbf24;
      --b-deep: #78350f;
      --b-glow: rgba(251, 191, 36, 0.55);

      --shadow: 0 1px 2px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.7);
    }

    html, body {
      background: transparent;
      width: 100%; height: 100%;
      overflow: hidden;
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: flex-start;
      padding: 8px;
      gap: 28px;
    }

    /* ========== ONE PLAYER ========== */
    .player {
      --c:      var(--a);
      --c-deep: var(--a-deep);
      --c-glow: var(--a-glow);

      display: flex;
      gap: 10px;
      align-items: stretch;
      height: 280px;
    }
    .player[data-p="b"] {
      --c:      var(--b);
      --c-deep: var(--b-deep);
      --c-glow: var(--b-glow);
    }

    /* ===== Gauge ===== */
    .gauge {
      width: 10px;
      height: 100%;
      position: relative;
      background: rgba(0,0,0,0.4);
      border-radius: 5px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.06),
        0 1px 4px rgba(0,0,0,0.6);
      overflow: visible;
    }

    .gauge__track {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      overflow: hidden;
    }

    .gauge__fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 0%;
      border-radius: 5px;
      background: linear-gradient(180deg,
        var(--c) 0%,
        color-mix(in srgb, var(--c) 75%, var(--c-deep)) 40%,
        var(--c-deep) 100%);
      transition: height 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
    }

    /* Meniscus glow */
    .gauge__fill::before {
      content: '';
      position: absolute;
      top: -8px; left: -300%; right: -300%;
      height: 18px;
      background: radial-gradient(ellipse at center,
        var(--c) 0%,
        var(--c-glow) 35%,
        transparent 70%);
      filter: blur(3px);
      animation: pulse 2.6s ease-in-out infinite;
      pointer-events: none;
    }
    .gauge__fill::after {
      content: '';
      position: absolute;
      top: -1px; left: 0; right: 0;
      height: 2px;
      background: var(--c);
      box-shadow: 0 0 5px var(--c), 0 0 12px var(--c-glow);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }

    /* Record marker */
    .gauge__rec {
      position: absolute;
      left: -3px; right: -3px;
      height: 1px;
      background: rgba(255,255,255,0.75);
      box-shadow: 0 0 4px rgba(255,255,255,0.5);
      transition: bottom 0.55s ease;
      z-index: 3;
      pointer-events: none;
    }
    .gauge__rec::before {
      content: '';
      position: absolute;
      left: -4px; top: -2.5px;
      width: 0; height: 0;
      border-top: 3px solid transparent;
      border-bottom: 3px solid transparent;
      border-left: 4px solid rgba(255,255,255,0.9);
    }

    /* ===== Text column ===== */
    .info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      min-width: 60px;
    }

    .info__top {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .info__name {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 12px;
      letter-spacing: 0.01em;
      color: var(--c);
      text-shadow: var(--shadow);
      font-variation-settings: "opsz" 144;
      white-space: nowrap;
    }
    .info__num {
      font-family: 'Antonio', sans-serif;
      font-weight: 300;
      font-size: 44px;
      line-height: 0.85;
      color: #fff;
      letter-spacing: -0.025em;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow);
      margin-top: 1px;
    }
    .info__num--small { font-size: 34px; }
    .info__unit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.75);
      text-shadow: var(--shadow);
      margin-top: 1px;
    }

    .info__bot {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 7px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .info__peak {
      color: rgba(255,255,255,0.75);
      text-shadow: var(--shadow);
    }
    .info__peak strong {
      font-family: 'Antonio', sans-serif;
      font-weight: 400;
      font-size: 11px;
      color: #fff;
      letter-spacing: 0;
      margin-left: 2px;
    }
    .info__falls {
      color: rgba(255,255,255,0.55);
      text-shadow: var(--shadow);
    }
    .info__falls strong {
      font-family: 'Antonio', sans-serif;
      font-weight: 400;
      font-size: 10px;
      color: rgba(255,255,255,0.9);
      letter-spacing: 0;
      margin-right: 2px;
    }

    /* ===== Animations ===== */
    @keyframes leadEnter {
      0%   { opacity: 0; transform: translateY(-8px); }
      18%  { opacity: 1; transform: translateY(0); }
      82%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-4px); }
    }
    .lead-flash {
      position: fixed;
      top: 4px; left: 0; right: 0;
      text-align: center;
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      pointer-events: none;
      animation: leadEnter 3s ease forwards;
      z-index: 999;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-2px); }
      40%      { transform: translateX(2px); }
      60%      { transform: translateX(-1px); }
      80%      { transform: translateX(1px); }
    }
    .player.shaking { animation: shake 0.4s ease; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ── PLAYER A ── -->
  <div class="player" data-p="a" id="p-a">
    <div class="gauge">
      <div class="gauge__track">
        <div class="gauge__fill" id="fill-a" style="height:0%"></div>
      </div>
      <div class="gauge__rec" id="rec-a" style="bottom:0%"></div>
    </div>
    <div class="info">
      <div class="info__top">
        <div class="info__name" id="name-a">Matteo</div>
        <div class="info__num" id="num-a">0</div>
        <div class="info__unit">METRES</div>
      </div>
      <div class="info__bot">
        <div class="info__peak">peak<strong id="peak-a">0</strong></div>
        <div class="info__falls"><strong id="falls-a">00</strong>falls</div>
      </div>
    </div>
  </div>

  <!-- ── PLAYER B ── -->
  <div class="player" data-p="b" id="p-b">
    <div class="gauge">
      <div class="gauge__track">
        <div class="gauge__fill" id="fill-b" style="height:0%"></div>
      </div>
      <div class="gauge__rec" id="rec-b" style="bottom:0%"></div>
    </div>
    <div class="info">
      <div class="info__top">
        <div class="info__name" id="name-b">Abdou</div>
        <div class="info__num" id="num-b">0</div>
        <div class="info__unit">METRES</div>
      </div>
      <div class="info__bot">
        <div class="info__peak">peak<strong id="peak-b">0</strong></div>
        <div class="info__falls"><strong id="falls-b">00</strong>falls</div>
      </div>
    </div>
  </div>

<script>
  const params      = new URLSearchParams(window.location.search);
  const SOLO_PLAYER = params.get('player');
  const MAX_H       = 1200;

  if (SOLO_PLAYER === 'playerA') el('p-b').classList.add('hidden');
  else if (SOLO_PLAYER === 'playerB') el('p-a').classList.add('hidden');

  const socket = io(window.location.origin);
  socket.on('state_sync', applyState);
  socket.on('lead_change', ({ leader, state }) => { applyState(state); flashLead(leader, state); });
  socket.on('fall', ({ playerId }) => { shakeFall(playerId); });

  function applyState(s) {
    const a = s.playerA, b = s.playerB;

    setText('name-a', a.name || 'Matteo');
    setText('name-b', b.name || 'Abdou');

    setNum('num-a', a.height);
    setNum('num-b', b.height);
    setText('peak-a', Math.round(a.maxHeight));
    setText('peak-b', Math.round(b.maxHeight));
    setText('falls-a', String(a.falls).padStart(2, '0'));
    setText('falls-b', String(b.falls).padStart(2, '0'));

    const top   = Math.max(a.height, b.height, a.maxHeight, b.maxHeight, 1);
    const scale = Math.max(top * 1.05, MAX_H * 0.08);

    el('fill-a').style.height = pct(a.height,    scale) + '%';
    el('fill-b').style.height = pct(b.height,    scale) + '%';
    el('rec-a').style.bottom  = pct(a.maxHeight, scale) + '%';
    el('rec-b').style.bottom  = pct(b.maxHeight, scale) + '%';
  }

  function flashLead(leader, state) {
    if (SOLO_PLAYER && SOLO_PLAYER !== leader) return;
    if (leader === 'tie') return;
    const name  = leader === 'playerA' ? (state.playerA.name || 'Matteo') : (state.playerB.name || 'Abdou');
    const color = leader === 'playerA' ? '#67e8f9' : '#fbbf24';
    const glow  = leader === 'playerA' ? 'rgba(103,232,249,0.55)' : 'rgba(251,191,36,0.55)';
    const d = document.createElement('div');
    d.className = 'lead-flash';
    d.style.color = color;
    d.style.textShadow = '0 0 18px ' + glow + ', 0 2px 10px rgba(0,0,0,0.95)';
    d.textContent = '↑  ' + name + ' takes the lead';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3100);
  }

  function shakeFall(playerId) {
    const id = playerId === 'playerA' ? 'p-a' : 'p-b';
    const n = el(id);
    if (!n) return;
    n.classList.add('shaking');
    setTimeout(() => n.classList.remove('shaking'), 420);
  }

  function pct(v, m)      { return Math.min(100, Math.max(0, (v / m) * 100)).toFixed(2); }
  function el(id)         { return document.getElementById(id); }
  function setText(id, t) { const n = el(id); if (n) n.textContent = t; }
  function setNum(id, v) {
    const n = el(id); if (!n) return;
    const r = Math.round(v);
    n.textContent = r;
    n.classList.toggle('info__num--small', String(r).length >= 4);
  }
</script>
</body>
</html>
